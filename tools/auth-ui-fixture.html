<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../auth.css"><style>
:root{--bg-page:#fbf1f4;--card-bg:#fffdfd;--card-border:#f2e3ea;--paper:#fff;--rose:#cf5e8c;--rose-light:#fbeaf0;--rose-glow:#cf5e8c22;--text-main:#46313c;--text-heading:#341e2a;--text-muted:#8c6e7d;--text-lead:#6e5461;--line:#ecdbe3;--subtle-btn-border:#ebd3df}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui;color:var(--text-main)}button,input{font:inherit}button{cursor:pointer}.primary-button,.subtle-button{padding:10px;border:1px solid var(--subtle-btn-border);border-radius:12px}.primary-button{background:var(--rose);color:white}.subtle-button{background:var(--paper);color:var(--text-main)}#fixture-banner{padding:8px;text-align:center;background:#fbeaf0}.fixture-result{padding:24px}
</style></head><body><div id="fixture-banner">TEST ONLY · synthetic camera · no account/database</div><div id="fixture-root"></div><script src="../auth-ui.js"></script><script>
// Isolated UI fixture only. Does not load the real app or access its stored data.
const fixtureParams=new URLSearchParams(location.search),fixtureState=fixtureParams.get('state') || 'anonymous';
if(fixtureParams.get('theme')==='dark'){document.body.dataset.theme='oled-obsidian';document.documentElement.style.cssText='--bg-page:#18181c;--card-bg:#222228;--paper:#2b2931;--text-main:#eee4eb;--text-heading:#fff6fb;--rose:#d49ab4;--rose-light:#322631;--rose-glow:#0002;';}
let fixtureApproved=false,fixtureTracks=[],fixtureUploads=0;
const sourceCanvas=document.createElement('canvas');sourceCanvas.width=320;sourceCanvas.height=240;
const context=sourceCanvas.getContext('2d');context.fillStyle='#fbeaf0';context.fillRect(0,0,320,240);context.fillStyle='#46313c';context.font='24px sans-serif';context.fillText('SYNTHETIC TEST',45,120);
setInterval(()=>{context.fillStyle=Date.now()%2?'#cf5e8c':'#fbeaf0';context.fillRect(0,0,4,4);},100);
Object.defineProperty(navigator,'mediaDevices',{value:{getUserMedia:async()=>{const stream=sourceCanvas.captureStream(1);fixtureTracks.push(...stream.getTracks());return stream;}}});
const service={configured:true,googleConfigured:false,isAuthenticated:()=>fixtureApproved,async session(){return {status:fixtureState==='approved'?'approved':'pending'};},async login(){fixtureApproved=fixtureState==='approved';return {status:fixtureApproved?'approved':'pending'};},async register(payload){if(!payload.consent||!payload.photo)throw Error('Missing photo/consent');fixtureUploads++;return {status:'pending'};},async completeGoogleRegistration(payload){if(!payload.consent||!payload.photo)throw Error('Missing photo/consent');fixtureUploads++;return {status:'pending',emailVerified:true};},async logout(){fixtureApproved=false;}};
service.passkeyConfigured=fixtureParams.get('passkey')==='cancel';service.loginPasskey=async()=>{throw Error('Hyrja u anulua. Mund të përdorësh emailin.');};service.cancelPasskey=()=>{};
const fixtureRoot=document.getElementById('fixture-root');let view=EmmaAuthUI.mount(fixtureRoot,{service,status:fixtureState,email:fixtureState==='photo_required'?'emma@example.test':'',emailVerified:fixtureState==='photo_required',onAuthenticated(){view.destroy();fixtureRoot.innerHTML='<h1 class="fixture-result">TEST CALLBACK ONLY</h1>';}});
document.addEventListener('click',()=>requestAnimationFrame(()=>{document.getElementById('fixture-banner').textContent=`TEST ONLY · active tracks: ${fixtureTracks.filter(track=>track.readyState==='live').length} · uploads: ${fixtureUploads}`;}));
</script></body></html>
