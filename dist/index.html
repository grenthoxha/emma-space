/* ==========================================================================
   Global Reset & Balanced Proportions
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg-page);
  color: var(--text-main);
  font-family: "DM Sans", "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.65;
  letter-spacing: 0.01em;
  transition: background 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent !important;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent !important;
}

a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
}

:focus {
  outline: none;
}

:focus-visible {
  outline: 2px solid var(--rose);
  outline-offset: 2px;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

h1, h2, h3, .font-serif {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 600;
  line-height: 1.22;
  color: var(--text-heading);
  letter-spacing: -0.02em;
}

.eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--text-eyebrow);
  margin-bottom: 6px;
}

/* ==========================================================================
   App Shell & Symmetrical Layout Containers
   ========================================================================== */
.app-background {
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(0px, 2.5vw, 36px);
  background: radial-gradient(circle at 0 0, var(--bg-radial-1) 0, transparent 40%),
              radial-gradient(circle at 100% 100%, var(--bg-radial-2) 0, transparent 35%),
              linear-gradient(135deg, var(--bg-linear-1), var(--bg-linear-2) 50%, var(--bg-linear-3));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.app-shell {
  width: min(1120px, 100%);
  min-height: calc(100vh - clamp(0px, 5vw, 72px));
  min-height: calc(100dvh - clamp(0px, 5vw, 72px));
  background: var(--bg-shell);
  border: 1px solid var(--shell-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shell-shadow);
  padding: clamp(16px, 2.5vw, 28px) clamp(16px, 3.5vw, 42px) calc(96px + env(safe-area-inset-bottom));
  position: relative;
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  overflow: hidden;
}

/* ==========================================================================
   Header Bar (Organized & Aligned)
   ========================================================================== */
.glass-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header-glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: clamp(10px, 1.8vw, 16px) 0;
  margin: calc(-1 * clamp(16px, 2.5vw, 28px)) 0 clamp(20px, 3vw, 32px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  transform: translateY(0);
  opacity: 1;
  will-change: transform, opacity;
  transition: transform .3s cubic-bezier(.22, 1, .36, 1), opacity .2s ease, background .3s ease;
}

@media (max-width: 768px) {
  .glass-header.is-scroll-hidden {
    transform: translateY(calc(-100% - 18px));
    opacity: 0;
    pointer-events: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .glass-header { transition-duration: .01ms; }
}

.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(14.5px, 2vw, 16.5px);
  font-weight: 500;
  color: var(--text-heading);
  white-space: nowrap;
  min-width: 0;
}

.wordmark .tulip-icon {
  font-size: clamp(20px, 2.8vw, 24px);
  display: inline-block;
  animation: floatTulip 3.5s ease-in-out infinite alternate;
  flex-shrink: 0;
}

@keyframes floatTulip {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-3px) rotate(4deg); }
}

.wordmark b {
  font-size: clamp(16.5px, 2.4vw, 19px);
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.6vw, 12px);
  flex-shrink: 0;
}

.date-pill {
  font-size: 11.5px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--badge-bg);
  color: var(--badge-text);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.icon-pill-btn {
  width: 38px;
  height: 38px;
  min-width: 38px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--subtle-btn-text);
  font-size: 16px;
  transition: var(--transition-smooth);
}
.icon-pill-btn:hover {
  background: var(--subtle-btn-hover);
  transform: translateY(-2px);
}



.profile-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 12px 3px 3px;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition: var(--transition-smooth);
}
.profile-pill img {
  width: 30px;
  height: 30px;
  min-width: 30px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 25%;
  border: 2px solid var(--paper);
}
.profile-pill {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  outline: none;
}
.profile-pill:active {
  transform: scale(0.95);
}
.profile-pill.active {
  background: var(--subtle-btn-hover);
  border-color: var(--rose);
}
@media (hover: hover) and (pointer: fine) {
  .profile-pill:hover {
    background: var(--subtle-btn-hover);
    border-color: var(--rose);
    transform: translateY(-2px);
  }
}

/* ==========================================================================
   Bottom Floating Navigation (Balanced & Symmetrical)
   ========================================================================== */
.glass-nav {
  position: fixed;
  left: 50%;
  bottom: max(12px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(600px, calc(100vw - 24px));
  z-index: 90;
  background: var(--nav-glass);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--shell-border);
  border-radius: var(--radius-full);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.16);
  padding: 5px 8px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent !important;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  color: var(--text-muted);
  font-size: clamp(10.5px, 2.4vw, 11.5px);
  font-weight: 600;
  transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  min-height: 46px;
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.nav-item:focus,
.nav-item:focus-visible,
.nav-item:visited {
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

.nav-item:active {
  transform: scale(0.92);
  transition: transform 0.08s ease;
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

.nav-item .nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  transition: transform 0.25s ease;
  pointer-events: none;
}

.nav-item .nav-icon svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
  transition: stroke 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}

.nav-item span {
  pointer-events: none;
}

@media (hover: hover) and (pointer: fine) {
  .nav-item:hover {
    color: var(--rose);
  }
  .nav-item:hover .nav-icon svg {
    transform: translateY(-2px);
    stroke: var(--rose);
  }
}

.nav-item.active {
  color: var(--primary-btn-text);
  background: linear-gradient(110deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  box-shadow: 0 6px 16px var(--rose-glow);
}
.nav-item.active .nav-icon svg {
  stroke: #ffffff;
}

.nav-badge {
  position: absolute;
  top: 5px;
  right: calc(50% - 13px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rose);
  border: 2px solid var(--paper);
}

/* ==========================================================================
   Standardized Buttons & Form Controls (Consistent 44px Height)
   ========================================================================== */
.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 clamp(16px, 3vw, 24px);
  border-radius: var(--radius-md);
  background: linear-gradient(110deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  color: var(--primary-btn-text);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--primary-btn-shadow);
  transition: var(--transition-smooth);
  white-space: nowrap;
}
.primary-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 10px 24px var(--rose-glow);
}
.primary-button:active {
  transform: translateY(0);
}
.primary-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.hidden:not(.confirm-overlay) {
  display: none !important;
}

.primary-button.hidden,
.subtle-button.hidden,
button.hidden {
  display: none !important;
}

#study-top-actions button:not(.hidden) {
  animation: fadeInPop 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeInPop {
  0% {
    opacity: 0;
    transform: scale(0.94) translateY(3px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.subtle-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 clamp(14px, 2.8vw, 18px);
  border-radius: var(--radius-md);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--subtle-btn-text);
  font-size: 12.5px;
  font-weight: 600;
  transition: var(--transition-smooth);
  white-space: nowrap;
}
.subtle-button:hover {
  background: var(--subtle-btn-hover);
  border-color: var(--rose);
  transform: translateY(-2px);
}
.subtle-button:active {
  transform: translateY(0);
}

.chip-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  transition: var(--transition-smooth);
  touch-action: manipulation;
}
.chip-button:hover {
  border-color: var(--rose);
  color: var(--text-main);
  background: var(--card-hover);
  transform: translateY(-1px);
}
.chip-button.selected, .chip-button.active {
  background: var(--badge-bg);
  border-color: var(--rose);
  color: var(--badge-text);
  font-weight: 700;
}

.clean-input, .clean-select {
  width: 100%;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 13px;
  background: color-mix(in srgb, var(--paper) 96%, var(--rose) 4%);
  border: 1px solid color-mix(in srgb, var(--card-border) 82%, var(--rose) 18%);
  color: var(--text-main);
  font-size: 13.5px;
  outline: none;
  caret-color: var(--rose);
  box-shadow: 0 1px 0 rgba(255,255,255,.65) inset;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.clean-input:hover, .clean-select:hover {
  border-color: color-mix(in srgb, var(--rose) 38%, var(--card-border));
  background: var(--paper);
}
.clean-input:focus, .clean-select:focus {
  border-color: var(--rose);
  background: var(--paper);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--rose-glow) 78%, transparent), 0 8px 20px rgba(89, 57, 69, .06);
}

.clean-input::placeholder,
textarea::placeholder {
  color: color-mix(in srgb, var(--text-muted) 78%, transparent);
  opacity: 1;
}

/* Të gjitha zonat e shkrimit mbeten me madhësi të kontrolluar. */
textarea {
  resize: none !important;
  overflow-y: auto;
  caret-color: var(--rose);
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--rose) 35%, transparent) transparent;
}

/* ==========================================================================
   Home Hero Section (Symmetrical & Clean)
   ========================================================================== */
.home-hero {
  display: flex;
  justify-content: center;
  padding: 8px 0 clamp(24px, 3.5vw, 36px);
}

.home-profile-stack {
  width: min(100%, 520px);
}

.home-profile-stack .quick-action-bar {
  margin: 12px 0 0;
}

.hero-left h1 {
  font-size: clamp(34px, 6.5vw, 66px);
  letter-spacing: -2px;
  line-height: 1.08;
  margin: 6px 0 14px;
}
.hero-left h1 em {
  color: var(--rose);
  font-style: italic;
  font-weight: 500;
}

.hero-care-note {
  font-size: clamp(13.5px, 2vw, 15px);
  line-height: 1.65;
  color: var(--text-lead);
  max-width: 520px;
  margin-bottom: 22px;
}

.hero-profile {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: clamp(20px, 3vw, 28px) 20px clamp(18px, 2.5vw, 24px);
  border-radius: var(--radius-lg);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 16px 36px var(--shell-shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero-profile img {
  position: relative;
  z-index: 2;
  width: clamp(120px, 22vw, 145px);
  height: clamp(120px, 22vw, 145px);
  object-fit: cover;
  object-position: center 24%;
  border-radius: 46% 46% 42% 42%;
  border: 4px solid var(--paper);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
  margin-bottom: 12px;
}

.hero-profile .name-title {
  position: relative;
  z-index: 2;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--rose);
  margin-bottom: 4px;
}

.hero-profile .profile-summary-pill {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: 12px;
  font-weight: 700;
  margin-top: 4px;
}

/* ==========================================================================
   Quick Actions Bar
   ========================================================================== */
.quick-action-bar {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 30px;
}
.quick-action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 700;
  transition: var(--transition-smooth);
  text-align: center;
}
.quick-action-btn:hover {
  border-color: var(--rose);
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px var(--shell-shadow);
}

/* ==========================================================================
   Dashboard Grid (Equal Height Hub Cards)
   ========================================================================== */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: clamp(14px, 2vw, 20px);
  margin-bottom: 36px;
  align-items: stretch;
}

.hub-card {
  padding: clamp(18px, 2.5vw, 24px);
  border-radius: var(--radius-lg);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
  transition: var(--transition-smooth);
  height: 100%;
}
.hub-card:hover {
  transform: translateY(-3px);
  border-color: var(--rose);
  box-shadow: 0 14px 32px var(--shell-shadow);
}

.hub-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.hub-card-icon {
  width: 42px;
  height: 42px;
  min-width: 42px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  font-size: 20px;
}
.hub-card-icon.routine-ico { background: var(--badge-bg); color: var(--rose); }
.hub-card-icon.study-ico { background: var(--accent-blue-bg); color: var(--accent-blue); }
.hub-card-icon.focus-ico { background: #fff3e6; color: #d97706; }
.hub-card-icon.journal-ico { background: var(--accent-green-bg); color: var(--accent-green); }

.hub-card-body b {
  display: block;
  font-size: 17px;
  margin: 4px 0 2px;
}
.hub-card-body small {
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.45;
  display: block;
}

.progress-track {
  width: 100%;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--line);
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  transition: width 0.35s ease;
}

/* ==========================================================================
   Action Cards (Main Spaces Grid)
   ========================================================================== */
.section-title-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title-row h2 {
  font-size: clamp(20px, 3.5vw, 26px);
}

.action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: clamp(12px, 2vw, 18px);
  margin-bottom: 32px;
  align-items: stretch;
}

.action-card {
  padding: clamp(16px, 2.5vw, 22px);
  border-radius: var(--radius-lg);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  display: grid;
  grid-template-columns: 44px 1fr 20px;
  gap: 14px;
  align-items: center;
  color: var(--text-main);
  transition: var(--transition-smooth);
}
.action-card:hover {
  transform: translateY(-3px);
  border-color: var(--rose);
  box-shadow: 0 12px 28px var(--shell-shadow);
}
.action-card .card-ico {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  font-size: 20px;
}
.action-card b {
  display: block;
  font-size: 16.5px;
}
.action-card small {
  display: block;
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 2px;
  line-height: 1.4;
}
.action-card i.arrow {
  font-style: normal;
  font-size: 18px;
  color: var(--rose);
  transition: transform 0.2s ease;
}
.action-card:hover i.arrow {
  transform: translateX(4px);
}

/* ==========================================================================
   Study Space & Focus Timer
   ========================================================================== */
.study-screen {
  max-width: 900px;
  margin: 0 auto;
}

.focus-timer-box {
  padding: clamp(20px, 3.5vw, 32px);
  border-radius: var(--radius-lg);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 12px 32px var(--shell-shadow);
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: clamp(18px, 3.5vw, 32px);
  align-items: center;
  margin-bottom: 32px;
}

.focus-left b {
  font-size: clamp(20px, 3vw, 24px);
  display: block;
  margin-bottom: 6px;
}
.focus-left p {
  color: var(--text-lead);
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 16px;
}

.focus-presets-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.timer-display-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.timer-clock {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(40px, 8.5vw, 56px);
  font-weight: 700;
  color: var(--rose);
  letter-spacing: -1.5px;
}

.timer-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

.task-manager-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.filter-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.task-list {
  display: grid;
  gap: 10px;
  margin-bottom: 28px;
}

.task-item {
  padding: 14px clamp(12px, 2vw, 18px);
  border-radius: var(--radius-md);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: var(--transition-smooth);
}
.task-item:hover {
  border-color: var(--rose);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.04);
}

.task-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}

.task-check-btn {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--paper);
  color: transparent;
  display: grid;
  place-items: center;
  font-size: 14px;
  transition: var(--transition-smooth);
}
.task-check-btn:hover {
  border-color: var(--rose);
  color: var(--rose);
}

.task-details {
  min-width: 0;
}
.task-details b {
  display: block;
  font-size: 14.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 11px;
  flex-wrap: wrap;
}

.badge-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-size: 10.5px;
  font-weight: 700;
  background: var(--badge-bg);
  color: var(--badge-text);
  white-space: nowrap;
}
.badge-tag.urgent { background: #fee2e2; color: #dc2626; }
.badge-tag.soon { background: #fef3c7; color: #d97706; }
.badge-tag.done { background: #dcfce7; color: #16a34a; }

/* Study & Exam Hub Styling — Equal Width Grid Segmented Tabs */
.study-sub-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0 22px;
  width: 100%;
}

.study-sub-tab-btn {
  width: 100%;
  padding: 9px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 6px;
  transition: var(--transition-fast);
  color: var(--text-main);
  user-select: none;
  -webkit-tap-highlight-color: transparent !important;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.study-sub-tab-btn:hover {
  background: var(--rose);
  color: #ffffff;
  border-color: var(--rose);
  transform: translateY(-1px);
}

.study-sub-tab-btn.active {
  background: var(--rose);
  color: #ffffff;
  border-color: var(--rose);
  box-shadow: 0 4px 14px var(--rose-glow);
  transform: translateY(-1px);
}

.tab-txt-mobile { display: none; }
.tab-txt-desktop { display: inline; }

@media (max-width: 640px) {
  .tab-txt-mobile { display: inline; }
  .tab-txt-desktop { display: none; }

  /* Sub Navigation Tabs — Fixed Equal 3-Column Grid on Mobile */
  .study-sub-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 8px 0 16px;
    width: 100%;
    overflow: visible;
  }
  .study-sub-tab-btn {
    padding: 7px 3px;
    font-size: 11px;
    font-weight: 600;
    gap: 3px;

  /* 1. Plani & Detyrat — Compact Mobile Size */

  }

  .subject-card-lux {

    gap: 9px;
  }
  .subject-icon-circle {
    width: 32px;

  }
  .subject-card-top b {

  }
  .subject-card-top small {
    font-size: 10.5px !important;
  }
  .subject-stats-pills {
    gap: 4px;
    font-size: 10px;
  }
  .subject-stat-pill {
    padding: 1.5px 6px;
    font-size: 9.5px;
  }
  .subject-card-actions {
    padding-top: 6px;
  }
}

.study-tab-panel {
  width: 100%;
}

.filter-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

.filter-tabs::-webkit-scrollbar {

/* ==========================================================================
   Fullscreen Pomodoro Arena — All Text Inside Circle & 100% Responsive
   ========================================================================== */
.focus-fullscreen-arena {
  position: fixed !important;
  inset: 0 !important;
  z-index: 9999 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  background: var(--bg-page) !important;
  color: var(--text-main) !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: space-between !important;
  align-items: center !important;
  padding: max(16px, env(safe-area-inset-top)) clamp(16px, 3.5vw, 40px) max(20px, env(safe-area-inset-bottom)) !important;
  animation: arenaFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
  user-select: none !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  box-sizing: border-box !important;
}

.focus-fullscreen-arena.hidden {
  display: none !important;
}

.arena-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  max-width: 840px;
  flex-shrink: 0;
}

.arena-subject-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: clamp(11.5px, 2.2vw, 13px);
  font-weight: 700;
  border: 1px solid var(--card-border);
  max-width: min(220px, 45vw);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.arena-wakelock-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--text-muted);
  font-size: clamp(10.5px, 2vw, 11.5px);
  font-weight: 600;
  white-space: nowrap;
}

.ambient-sound-select {
  height: 36px;
  padding: 0 10px;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--text-main);
  font-size: clamp(11px, 2vw, 12px);
  font-weight: 600;
  outline: none;
  cursor: pointer;
  max-width: 140px;
}

/* Center Piece with Adaptive Ring */
.arena-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin: auto;
  position: relative;
  width: 100%;
}

.timer-ring-container {
  position: relative;
  /* Perfect responsive sizing tied to both viewport width & height */
  width: min(76vw, min(360px, 38vh));
  height: min(76vw, min(360px, 38vh));
  min-width: 220px;
  min-height: 220px;
  display: grid;
  place-items: center;
  margin: 0 auto;
}

.timer-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.timer-svg-track {
  fill: none;
  stroke: var(--line);
  stroke-width: 6;
}

.timer-svg-progress {
  fill: none;
  stroke: var(--rose);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
  filter: drop-shadow(0 0 14px var(--rose-glow));
}

.timer-ring-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
  gap: clamp(8px, 2vh, 14px);
  padding: clamp(14px, 3vw, 24px);
  text-align: center;
  box-sizing: border-box;
}

.arena-top-tag {
  font-size: clamp(9px, 1.8vw, 11px);
  font-weight: 700;
  letter-spacing: 1.8px;
  color: var(--text-eyebrow);
  text-transform: uppercase;
}

.arena-clock {
  font-family: "Playfair Display", Georgia, serif;
  font-size: min(13vw, min(74px, 8.8vh));
  font-weight: 700;
  color: var(--text-heading);
  line-height: 1;
  letter-spacing: -2px;
  margin: 0;
}

.arena-status-text {
  font-size: clamp(9.5px, 1.8vw, 11px);
  font-weight: 700;
  color: var(--badge-text);
  letter-spacing: 1.3px;
  text-transform: uppercase;
  background: var(--badge-bg);
  padding: 4px clamp(10px, 2.5vw, 14px);
  border-radius: var(--radius-full);
  border: 1px solid var(--card-border);
  display: inline-block;
  white-space: nowrap;
}

/* Arena Bottom Controls — Fluidly Responsive */
.arena-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  flex-shrink: 0;
}

.arena-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 clamp(14px, 3vw, 20px);
  border-radius: var(--radius-full);
  font-size: clamp(12px, 2.2vw, 13.5px);
  font-weight: 700;
  transition: var(--transition-smooth);
  white-space: nowrap;
}

.arena-primary-btn {
  background: linear-gradient(110deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  color: var(--primary-btn-text);
  box-shadow: 0 8px 22px var(--rose-glow);
}
.arena-primary-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}

.arena-subtle-btn {
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--subtle-btn-text);
}
.arena-subtle-btn:hover {
  background: var(--subtle-btn-hover);
  transform: translateY(-2px);
}

.arena-subtle-btn.locked {
  background: #fee2e2;
  border-color: #f87171;
  color: #dc2626;
}

/* Landscape Mode on Mobile */
@media (max-height: 520px) and (orientation: landscape) {
  .focus-fullscreen-arena {
    padding: 10px 20px !important;
  }
  .arena-center {
    padding: 4px 0;
  }
  .timer-ring-container {
    width: min(50vh, 220px);
    height: min(50vh, 220px);
    min-width: 180px;
    min-height: 180px;
  }
  .arena-clock {
    font-size: min(46px, 12vh);
  }
  .arena-controls {
    gap: 8px;
  }
  .arena-btn {
    min-height: 38px;
    padding: 0 12px;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .arena-wakelock-pill span:not(:first-child) {
    display: none;
  }
  .arena-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .arena-controls button {
    width: 100%;
    padding: 0 10px;
    font-size: 12px;
  }
}


/* ==========================================================================
   Modals, Toasts & Overlays
   ========================================================================== */
.confirm-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  transition: opacity 0.25s ease;
}
.confirm-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.confirm-modal {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: clamp(20px, 4vw, 28px);
  width: min(380px, 100%);
  text-align: center;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  animation: modalPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalPopIn {
  0% { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.confirm-modal b {
  font-size: 20px;
  display: block;
  margin-bottom: 8px;
}
.confirm-modal p {
  color: var(--text-lead);
  font-size: 13px;
  margin-bottom: 20px;
}
.confirm-actions {
  display: flex;
  gap: 10px;
}
.confirm-actions button {
  flex: 1;
}

.bloom-toast {
  position: fixed;
  z-index: 300;
  left: 50%;
  bottom: clamp(76px, 12vh, 96px);

  function normalizeSubjectNotes(savedNotes) {
    if (!savedNotes || typeof savedNotes !== "object") return {};
    const normalized = {};

    Object.entries(savedNotes).forEach(([subjectId, subjectValue]) => {
      if (!subjectValue || typeof subjectValue !== "object") return;

      // Shënimet e versionit të mëparshëm ruhen në datën e përditësimit të tyre.
      if (typeof subjectValue.content === "string") {
        const legacyTime = subjectValue.updatedAt ? new Date(subjectValue.updatedAt) : new Date();
        const legacyDate = Number.isNaN(legacyTime.getTime()) ? studyDayKey() : studyDayKey(legacyTime);
        normalized[subjectId] = {
          [legacyDate]: {
            content: subjectValue.content,
            updatedAt: subjectValue.updatedAt || new Date().toISOString()
          }
        };
        return;
      }

      const datedNotes = {};
      Object.entries(subjectValue).forEach(([dateKey, record]) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey) || !record || typeof record.content !== "string") return;
        datedNotes[dateKey] = { content: record.content, updatedAt: record.updatedAt || "" };
      });
      normalized[subjectId] = datedNotes;
    });

    return normalized;
  }

  let dbPromise = null;
  let storageReady = false;

  function openEmmaDB() {
    if (!window.indexedDB) return Promise.reject(new Error("IndexedDB unavailable"));
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "key" });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("Nuk u hap ruajtja lokale."));
    });
    return dbPromise;
  }

  async function readStoredState() {
    const db = await openEmmaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const request = tx.objectStore(STORE_NAME).get("state");
      request.onsuccess = () => resolve(request.result?.value || null);
      request.onerror = () => reject(request.error);
    });
  }

  async function persistStoredState(value) {
    const db = await openEmmaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({ key: "state", value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function clearStoredState() {
    const db = await openEmmaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete("state");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadPersistentState() {
    const stored = await readStoredState();
    if (stored) return normalizeState(stored);
    const migrated = loadLegacyState();
    await persistStoredState(migrated);
    return migrated;
  }

  function parseBackupPayload(parsed) {
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Format i pavlefshëm");
    if (parsed.format === BACKUP_FORMAT) {
      if (!Number.isInteger(parsed.version) || parsed.version < 1 || !parsed.data || typeof parsed.data !== "object") throw new Error("Backup i paplotë");
      return normalizeState(parsed.data);
    }
    const looksLegacy = Array.isArray(parsed.studyTasks) || Array.isArray(parsed.journalPages) || Array.isArray(parsed.subjects);
    if (!looksLegacy) throw new Error("Nuk është backup i Emma’s Space");
    return normalizeState(parsed);
  }

  function bytesToHex(bytes) {
    return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
  }

  async function hashPin(pin, salt) {
    const payload = new TextEncoder().encode(`${salt}:${pin}`);
    const digest = await crypto.subtle.digest("SHA-256", payload);
    return bytesToHex(new Uint8Array(digest));
  }

  function createPinSalt() {
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return bytesToHex(bytes);
  }

  async function tryUnlock(pin) {
    const now = Date.now();
    if (now < unlockBlockedUntil) return { ok: false, message: `Prit ${Math.ceil((unlockBlockedUntil - now) / 1000)} sekonda dhe provo përsëri.` };
    const candidate = await hashPin(pin, state.pin.salt);
    if (candidate === state.pin.hash) {
      appLocked = false;
      unlockAttempts = 0;
      render();
      resetAutoLockTimer();
      return { ok: true };
    }
    unlockAttempts += 1;
    if (unlockAttempts >= 5) {
      unlockAttempts = 0;
      unlockBlockedUntil = Date.now() + 30000;
      return { ok: false, message: "Shumë tentativa. Provo përsëri pas 30 sekondash." };
    }
    return { ok: false, message: "PIN-i nuk është i saktë." };
  }

  /* ==========================================================================
     Audio Synthesizer (Zero External Assets - Web Audio API)
     ========================================================================== */
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playSound(type) {
    if (!state.soundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      
      const now = ctx.currentTime;
      if (type === "complete") {
        // Uplifting Bell Chime (C5 -> E5 -> G5)
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.65);
        });
      } else if (type === "focus_done") {
        // Singing Bowl Warm Gong
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(432, now); // 432 Hz healing tone
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 2.6);
      } else if (type === "click") {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    } catch {}
  }

  function id(prefix = "item") {
    return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

  function escapeHTML(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  function today(offset = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
  }

  function daysUntil(dateText) {
    if (!dateText) return 999;
    const due = new Date(`${dateText}T12:00:00`);
    const now = new Date();
    now.setHours(12, 0, 0, 0);
    return Math.round((due - now) / 86400000);
  }

  function dueBadgeHTML(dateText) {
    const days = daysUntil(dateText);
    if (days < 0) return `<span class="badge-tag urgent">⚠️ ${Math.abs(days)} ditë me vonesë</span>`;
    if (days === 0) return `<span class="badge-tag urgent">🔴 Sot</span>`;
    if (days === 1) return `<span class="badge-tag soon">🟠 Nesër</span>`;
    if (days <= 3) return `<span class="badge-tag soon">🟡 Pas ${days} ditësh</span>`;
    return `<span class="badge-tag">📅 ${dateText}</span>`;
  }

  function prettyAlbanianDate(isoString) {
    const date = isoString ? new Date(isoString) : new Date();
    const days = ["E Diel", "E Hënë", "E Martë", "E Mërkurë", "E Enjte", "E Premte", "E Shtunë"];
    const months = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
    return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]}`;
  }

  function formatExamDate(isoString) {
    if (!isoString) return "Pa datë";
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return isoString;
    const months = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
    const days = ["E Diel", "E Hënë", "E Martë", "E Mërkurë", "E Enjte", "E Premte", "E Shtunë"];
    return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
  }

  function formatExamTime(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return "";
    const h = String(date.getHours()).padStart(2, "0");
    const m = String(date.getMinutes()).padStart(2, "0");
    return `${h}:${m}`;
  }

  function getExamCountdown(isoString) {
    if (!isoString) return { text: "Pa orar", status: "normal", hoursLeft: 9999 };
    const target = new Date(isoString);
    if (isNaN(target.getTime())) return { text: "Datë e pavlefshme", status: "normal", hoursLeft: 9999 };
    
    const now = new Date();
    const diffMs = target.getTime() - now.getTime();

    if (diffMs <= 0) {
      const diffHoursAgo = Math.abs(diffMs) / (1000 * 60 * 60);
      if (diffHoursAgo < 6) {
        return { text: "🔥 Po mbahet / Sot!", status: "urgent", hoursLeft: 0 };
      }
      return { text: "✅ Përfundoi", status: "done", hoursLeft: -1 };
    }

    const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
    const days = Math.floor(totalHours / 24);
    const hours = totalHours % 24;
    const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

    let status = "normal";
    if (totalHours < 24) status = "urgent";
    else if (totalHours < 72) status = "soon";

    if (days === 0) {
      if (hours === 0) {
        return { text: `⚠️ Edhe ${mins} min!`, status, hoursLeft: totalHours };
      }
      return { text: `⚠️ Edhe ${hours} orë e ${mins} min`, status, hoursLeft: totalHours };
    }
    if (days === 1) {
      return { text: `⏳ Nesër (${hours} orë mbetur)`, status, hoursLeft: totalHours };
    }
    return { text: `⏳ Edhe ${days} ditë e ${hours} orë`, status, hoursLeft: totalHours };
  }

  function bloomToast(message, icon = "🌷") {

    toast.className = "bloom-toast";
    toast.innerHTML = `<span>${icon}</span> ${escapeHTML(message)}`;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.classList.add("show"), 20);
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 350);
    }, 2800);
  }

  async function requestScreenWakeLock() {

  let ambientSource = null;
  let ambientGain = null;
  let currentAmbient = "none";

  function startAmbientSound(type) {
    stopAmbientSound();
    currentAmbient = type;
    if (type === "none") return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;

      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        if (type === "rain") {
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        } else if (type === "waves") {
          data[i] = (lastOut + (0.01 * white)) / 1.01;
          lastOut = data[i];
          data[i] *= 4.0;
        }
      }

      ambientSource = ctx.createBufferSource();
      ambientSource.buffer = buffer;
      ambientSource.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = type === "rain" ? "lowpass" : "bandpass";
      filter.frequency.setValueAtTime(type === "rain" ? 1100 : 350, ctx.currentTime);

      ambientGain = ctx.createGain();
      ambientGain.gain.setValueAtTime(0.09, ctx.currentTime);

      ambientSource.connect(filter);
      filter.connect(ambientGain);
      ambientGain.connect(ctx.destination);
      ambientSource.start();
    } catch {}
  }

  function stopAmbientSound() {
    if (ambientSource) {
      try { ambientSource.stop(); } catch {}
      ambientSource = null;
    }
  }

  function triggerBloomBurst(message) {
    if (message) {
      bloomToast(message, "👑");
    }
    playSound("complete");

    const overlay = document.createElement("div");
    overlay.className = "bloom-burst-overlay";
    document.body.appendChild(overlay);

    const icons = ["🌸", "🌷", "✨", "💖", "🌿", "✦", "👑", "🌺"];
    const count = 36;
    const startX = window.innerWidth / 2;
    const startY = window.innerHeight / 2;

    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "bloom-particle";
      p.textContent = icons[Math.floor(Math.random() * icons.length)];
      p.style.left = `${startX}px`;
      p.style.top = `${startY}px`;
      p.style.fontSize = `${16 + Math.random() * 20}px`;

      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
      const dist = 120 + Math.random() * 280;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 50;
      const rot = `${Math.floor(Math.random() * 720 - 360)}deg`;

      p.style.setProperty("--dx", `${dx}px`);
      p.style.setProperty("--dy", `${dy}px`);
      p.style.setProperty("--rot", rot);

      overlay.appendChild(p);
    }

    setTimeout(() => {
      overlay.remove();
    }, 2500);
  }

  function launchFocusSession(mins, ambientType, subjectId, displayMode = "fullscreen") {
    focus.minutes = mins || 25;
    focus.seconds = focus.minutes * 60;
    focus.subjectId = subjectId || "";
    
    // Set ambient sound
    if (ambientType && ambientType !== "none") {
      startAmbientSound(ambientType);
    } else {
      stopAmbientSound();
    }

    // Start timer
    clearInterval(focus.timer);
    focus.active = true;
    persistFocusSession();
    focus.timer = setInterval(() => {
      focus.seconds -= 1;
      updateTimerDOM();
      if (focus.seconds <= 0) {
        finishFocusSession();
      }
    }, 1000);

    // Close modal
    const overlay = document.getElementById("confirm-overlay");
    if (overlay) {
      overlay.classList.add("hidden");
      overlay.innerHTML = "";
    }

    updateTimerDOM();
    playSound("click");

    if (displayMode === "fullscreen") {
      openFocusFullscreen();
      updateArenaDOM();
      bloomToast(`Fokusi nisi në Ekran të Plotë (${focus.minutes}m) ⏱️`);
    } else {
      closeFocusFullscreen();
      bloomToast(`Fokusi nisi në sfond (${focus.minutes}m) 📱. Mund të lundrosh lirisht!`);
    }
  }

  /* ==========================================================================
     Focus Timer Logic
     ========================================================================== */
  let focus = {
    active: false,
    minutes: 25,
    seconds: 1500,
    subjectId: "",
    timer: null,
    saved: false
  };

  function persistFocusSession() {
    state.focusSession = {
      active: !!focus.active,
      minutes: focus.minutes,
      seconds: Math.max(0, focus.seconds),
      subjectId: focus.subjectId || "",
      endAt: focus.active ? Date.now() + Math.max(0, focus.seconds) * 1000 : 0
    };
    save();
  }

  function clearFocusSession() {
    state.focusSession = null;
    save();
  }

  function hydrateFocusSession() {
    const saved = state.focusSession;
    if (!saved) return;
    focus.minutes = saved.minutes || 25;
    focus.subjectId = saved.subjectId || "";
    focus.seconds = saved.active && saved.endAt ? Math.max(0, Math.ceil((saved.endAt - Date.now()) / 1000)) : Math.max(0, saved.seconds || 0);
    focus.active = !!saved.active && focus.seconds > 0;
    focus.saved = false;
    if (focus.active) {
      focus.timer = setInterval(() => {
        focus.seconds = Math.max(0, focus.seconds - 1);
        updateTimerDOM();
        if (focus.seconds <= 0) finishFocusSession();
      }, 1000);
    } else if (focus.seconds <= 0) {
      focus.seconds = focus.minutes * 60;
      clearFocusSession();
    }
  }

  function formatTimer(totalSecs) {
    const m = Math.floor(totalSecs / 60);
    const s = totalSecs % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function updateTimerDOM() {
    const clockEl = document.getElementById("focus-clock");
    if (clockEl) clockEl.textContent = formatTimer(focus.seconds);

    const miniToggle = document.getElementById("mini-toggle-focus");
    const arena = document.getElementById("fullscreen-focus-arena");

    if (pill) {
      if (focus.active && !isArenaOpen) {
        pill.classList.remove("hidden");
      } else {
        pill.classList.add("hidden");
      }
    }
    if (miniClock) miniClock.textContent = formatTimer(focus.seconds);
    if (miniToggle) miniToggle.textContent = focus.active ? "⏸" : "▶";

    // Update Hero Live Pomodoro Clock in Home Screen
    const heroClock = document.getElementById("hero-live-pomo-clock");

    const heroToggle = document.getElementById("hero-pomo-toggle");
    if (heroToggle) heroToggle.textContent = focus.active ? "⏸️ Ndalo" : "▶️ Fillo";

    // Dynamic Swap of Hero Card in Home Screen if route is home
    if (route() === "home") {
      const heroAside = document.getElementById("home-hero-aside");
      if (heroAside) {
        const isCurrentlyPomo = heroAside.classList.contains("hero-active-pomodoro");
        if (focus.active && !isCurrentlyPomo) {
          heroAside.outerHTML = renderHeroRightCard();
        } else if (!focus.active && isCurrentlyPomo) {

    const toggleBtn = document.getElementById("focus-toggle");
    if (toggleBtn) {
      if (focus.active) {
        toggleBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" class="inline-svg"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> <span>Ndalo</span>`;

  function finishFocusSession() {
    clearInterval(focus.timer);
    focus.active = false;
    const studied = Math.max(1, Math.round((focus.minutes * 60 - focus.seconds) / 60));
    state.focusRecords.push({
      date: today(),
      minutes: studied,
      subjectId: focus.subjectId || undefined
    });
    state.focusSession = null;
    save();
    focus.seconds = focus.minutes * 60;
    updateTimerDOM();
    playSound("focus_done");
    triggerBloomBurst(`Mrekulli, Emma! Përfundove ${studied} minuta fokus të thellë. ✦`);

    updateRoutineProgressDOM();
  }

  /* ==========================================================================
     Subject Notes & Anki-style Flashcards
     ========================================================================== */
  function studyDayKey(date = new Date()) {
    const value = new Date(date);
    return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, "0")}-${String(value.getDate()).padStart(2, "0")}`;
  }

  function studyAddDays(days) {
    const date = new Date();
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() + Math.max(0, Number(days) || 0));
    return studyDayKey(date);
  }

  function subjectNoteDateLabel(dateKey, includeYear = false) {
    const date = new Date(`${dateKey}T12:00:00`);
    if (Number.isNaN(date.getTime())) return dateKey;
    const weekdays = ["E diel", "E hënë", "E martë", "E mërkurë", "E enjte", "E premte", "E shtunë"];
    const months = ["janar", "shkurt", "mars", "prill", "maj", "qershor", "korrik", "gusht", "shtator", "tetor", "nëntor", "dhjetor"];
    if (includeYear) return `${weekdays[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    return `${date.getDate()} ${months[date.getMonth()].slice(0, 3)}`;
  }

  function subjectCards(subjectId) {
    return (state.flashcards || [])
      .filter(card => card.subjectId === subjectId)
      .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
  }

  function subjectDueCards(subjectId) {
    const todayKey = studyDayKey();
    return subjectCards(subjectId).filter(card => !card.dueDate || card.dueDate <= todayKey);
  }

  function flashcardDueLabel(card) {
    if (!card.dueDate || card.dueDate <= studyDayKey()) return "Për sot";
    const date = new Date(`${card.dueDate}T12:00:00`);
    return `Më ${new Intl.DateTimeFormat("sq-AL", { day: "numeric", month: "short" }).format(date)}`;
  }

  function subjectStudyWorkspace(subject) {
    if (!subject) return "";
    const selectedNoteDate = activeSubjectNoteDate || studyDayKey();
    const subjectNotes = state.subjectNotes?.[subject.id] || {};
    const notesRecord = subjectNotes[selectedNoteDate] || {};
    const savedNoteDates = Object.keys(subjectNotes)
      .filter(dateKey => subjectNotes[dateKey]?.content?.trim())
      .sort((a, b) => b.localeCompare(a));
    const cards = subjectCards(subject.id);
    const dueCards = subjectDueCards(subject.id);
    const learnedCards = cards.filter(card => Number(card.interval || 0) >= 7).length;
    const isReviewing = studyReviewSubjectId === subject.id;
    const currentCard = isReviewing && studyReviewQueue.length
      ? state.flashcards.find(card => card.id === studyReviewQueue[0])
      : null;

    let cardsContent = "";
    if (isReviewing) {
      if (currentCard) {
        cardsContent = `
          <div class="flashcard-review" aria-live="polite">
            <div class="flashcard-review-progress">${studyReviewQueue.length} KARTELA TË MBETURA</div>
            <span class="flashcard-question-label">PYETJA</span>
            <p class="flashcard-question">${escapeHTML(currentCard.question)}</p>
            ${studyReviewAnswerShown ? `

                <button type="button" data-rate-flashcard="good" data-card-id="${currentCard.id}">E dija<small>pas ${Math.max(2, Math.round((currentCard.interval || 1) * (currentCard.ease || 2.3)))} ditësh</small></button>
              </div>
            ` : `
              <button type="button" class="primary-button" id="btn-reveal-flashcard">Shfaq përgjigjen</button>
            `}
          </div>
        `;
      } else {
        cardsContent = `

            <span style="font-size: 28px; margin-bottom: 8px;">✓</span>
            <p class="flashcard-question" style="font-size: 22px;">Seanca u përfundua.</p>

      }
    } else {

          </label>
          <div class="flashcard-form-actions">
            ${cards.length ? `<button type="button" class="subtle-button" data-start-flashcard-review="${subject.id}">${dueCards.length ? `Përsërit ${dueCards.length} për sot` : "Ushtro kartelat"}</button>` : ""}

        </form>
        ${cards.length ? `

            ${cards.slice(0, 5).map(card => `
              <div class="flashcard-list-row">
                <div><b>${escapeHTML(card.question)}</b><small>${flashcardDueLabel(card)} · ${Number(card.reviews || 0)} përsëritje</small></div>
                <button type="button" class="subtle-button" data-delete-flashcard="${card.id}" aria-label="Fshi kartelën" style="min-height: 30px; padding: 0 8px; color: var(--rose);">×</button>

      `;
    }

    return `

          <div class="subject-workspace-title">

          </div>
          <button type="button" class="subtle-button" id="btn-close-subject-tools">Mbyll</button>
        </div>
        <div class="subject-tools-grid">
          <form id="subject-notes-form" class="subject-tool-panel" data-subject-id="${subject.id}" data-note-date="${selectedNoteDate}">
            <div class="subject-tool-panel-head">

            <div class="subject-note-date-row">
              <label for="subject-note-date">
                <span>Data e shënimit</span>
                <input type="date" id="subject-note-date" value="${selectedNoteDate}" aria-label="Data e shënimit">
              </label>
              ${selectedNoteDate !== studyDayKey() ? `<button type="button" class="subtle-button" data-subject-note-date="${studyDayKey()}">Kthehu te sot</button>` : ""}
            </div>
            ${savedNoteDates.length ? `
              <div class="subject-note-days" aria-label="Ditët me shënime">
                ${savedNoteDates.slice(0, 8).map(dateKey => `
                  <button type="button" class="subject-note-day ${dateKey === selectedNoteDate ? "active" : ""}" data-subject-note-date="${dateKey}">${escapeHTML(subjectNoteDateLabel(dateKey))}</button>
                `).join("")}
              </div>
            ` : ""}
            <textarea id="subject-notes-text" class="subject-notes-area" maxlength="12000" placeholder="Shkruaj shënimet e ${escapeHTML(subjectNoteDateLabel(selectedNoteDate, true))} për ${escapeHTML(subject.name)}...">${escapeHTML(notesRecord.content || "")}</textarea>
            <div class="subject-notes-footer">
              <small>${notesRecord.updatedAt ? `Ruajtur më ${new Intl.DateTimeFormat("sq-AL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(notesRecord.updatedAt))}` : `Pa shënim për ${escapeHTML(subjectNoteDateLabel(selectedNoteDate))}`}</small>
              <button type="submit" class="primary-button">Ruaj për këtë datë</button>
            </div>
          </form>
          <section class="subject-tool-panel">
            <div class="subject-tool-panel-head">
              <div><b>Kartelat pyetje–përgjigje</b><small>Përsëritje e planifikuar ngjashëm me Anki.</small></div>
              ${isReviewing ? `<button type="button" class="subtle-button" id="btn-stop-flashcard-review" style="min-height: 30px; padding: 0 8px;">Ndalo</button>` : ""}
            </div>
            <div class="flashcard-summary">
              <div><b>${cards.length}</b><small>gjithsej</small></div>
              <div><b>${dueCards.length}</b><small>për sot</small></div>
              <div><b>${learnedCards}</b><small>të mësuara</small></div>
            </div>
            ${cardsContent}
          </section>
        </div>
      </section>
    `;
  }

  function compressJournalPhoto(file) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith("image/")) return reject(new Error("Skedari nuk është fotografi."));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Fotografia nuk u lexua."));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error("Fotografia nuk u hap."));
        image.onload = () => {
          const maxSide = 1400;
          const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const ctx = canvas.getContext("2d", { alpha: false });
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          let data = canvas.toDataURL("image/webp", .82);
          let type = "image/webp";
          if (!data.startsWith("data:image/webp")) {
            data = canvas.toDataURL("image/jpeg", .84);
            type = "image/jpeg";
          }
          resolve({ id: id("photo"), name: file.name || "fotografi", type, data });
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ==========================================================================
     Journal (Ditari) Save Handler — 100% Reliable
     ========================================================================== */
  async function saveJournalEntry() {
    const titleInput = document.getElementById("journal-title");
    const bodyInput = document.getElementById("journal-body");
    if (!titleInput || !bodyInput) return;

    const title = titleInput.value.trim() || "Një kujtim i bukur";
    const body = bodyInput.value.trim();

    if (!body) {
      bloomToast("Shkruaj diçka para se ta ruash faqen ♡");
      bodyInput.focus();
      return;
    }

    const now = new Date().toISOString();
    const existing = editingJournalId ? state.journalPages.find(page => page.id === editingJournalId) : null;
    if (existing) {
      Object.assign(existing, { title, body, mood: currentMood || existing.mood, photos: pendingJournalPhotos, updatedAt: now });
    } else {
      state.journalPages.unshift({
        id: id("page"),
        date: now,
        updatedAt: now,
        title,
        body,
        mood: currentMood || "😌 E qetë",
        style: "clean",
        photos: pendingJournalPhotos
      });
    }

    await save();
    editingJournalId = null;
    pendingJournalPhotos = [];
    currentMood = "😌 E qetë";
    playSound("complete");
    bloomToast(existing ? "Ndryshimet u ruajtën ♡" : "Faqja jote u ruajt në ditar! ♡", "📖");
    render();
  }


  /* ==========================================================================
     Screens: Routines (Rutinat e mia)
     ========================================================================== */
  function routineScreen() {
    const totalCount = defaultRoutines.length + state.customRoutines.length;
    const doneCount = state.completed.length + (state.customRoutineDone || []).length;
    const percent = Math.round((doneCount / (totalCount || 1)) * 100);
    const hour = new Date().getHours();
    const currentBlock = hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening";
    const groups = [
      { key: "morning", label: "Mëngjesi", icon: "☀️", indexes: [0, 1, 2] },
      { key: "afternoon", label: "Pasditja", icon: "◷", indexes: [3, 4] },
      { key: "evening", label: "Mbrëmja", icon: "🌙", indexes: defaultRoutines.map((_, index) => index).filter(index => index >= 5) }
    ].sort((a, b) => Number(b.key === currentBlock) - Number(a.key === currentBlock));

    const routineRow = (routine, index) => `
      <div class="routine-row ${state.completed.includes(index) ? "done" : ""}" data-routine-idx="${index}">
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="routine-icon-badge">${routine.icon}</span>
          <b>${escapeHTML(routine.label)}</b>
        </div>
        <span style="font-size:18px;color:var(--rose);">${state.completed.includes(index) ? "✓" : "○"}</span>
      </div>
    `;

    const groupHTML = group => {
      const pending = group.indexes.filter(index => !state.completed.includes(index));
      const completed = group.indexes.filter(index => state.completed.includes(index));
      return `
        <details class="advanced-options routine-time-block" ${group.key === currentBlock ? "open" : ""}>
          <summary><span>${group.icon} ${group.label}</span><small>${pending.length} për të bërë</small></summary>
          <div class="advanced-options-panel">
            ${pending.length ? pending.map(index => routineRow(defaultRoutines[index], index)).join("") : '<p class="gentle-empty">Kjo pjesë e ditës është përfunduar.</p>'}
            ${completed.length ? `
              <details class="completed-items">
                <summary>${completed.length} të përfunduara</summary>
                <div>${completed.map(index => routineRow(defaultRoutines[index], index)).join("")}</div>
              </details>
            ` : ""}
          </div>
        </details>
      `;
    };

    const customPending = state.customRoutines.filter(routine => !(state.customRoutineDone || []).includes(routine.id));
    const customCompleted = state.customRoutines.filter(routine => (state.customRoutineDone || []).includes(routine.id));
    const customRow = routine => `
      <div class="routine-row ${(state.customRoutineDone || []).includes(routine.id) ? "done" : ""}" data-custom-routine-id="${routine.id}">
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="routine-icon-badge">${routine.icon || "♡"}</span>
          <b>${escapeHTML(routine.label)}</b>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:18px;color:var(--rose);">${(state.customRoutineDone || []).includes(routine.id) ? "✓" : "○"}</span>
          <button class="subtle-button" data-delete-custom-routine="${routine.id}" style="min-height:28px;padding:0 8px;" aria-label="Fshi zakonin">✕</button>
        </div>
      </div>
    `;

    return `
      <section class="screen routine-screen">
        <h1>Rutinat</h1>
        <div class="hub-card stagger-in" style="margin-bottom:18px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <b>${percent}% e përfunduar</b>
            <button class="subtle-button" id="btn-reset-routines" style="min-height:32px;">Nis ditë të re</button>
          </div>
          <div class="progress-track" style="margin-top:10px;"><div class="progress-bar" style="width:${percent}%;"></div></div>
        </div>

        ${groups.map(groupHTML).join("")}

        ${state.customRoutines.length ? `
          <details class="advanced-options routine-time-block">
            <summary><span>♡ Zakonet e mia</span><small>${customPending.length} për të bërë</small></summary>
            <div class="advanced-options-panel">
              ${customPending.map(customRow).join("") || '<p class="gentle-empty">Të gjitha janë përfunduar.</p>'}
              ${customCompleted.length ? `<details class="completed-items"><summary>${customCompleted.length} të përfunduara</summary><div>${customCompleted.map(customRow).join("")}</div></details>` : ""}
            </div>
          </details>
        ` : ""}

        <details class="advanced-options">
          <summary>Shto një zakon</summary>
          <div class="advanced-options-panel">
            <form id="custom-routine-form">
              <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <input id="custom-routine-label" class="clean-input" placeholder="Emri i zakonit" style="flex:1;min-width:180px;" required>

                  <option value="♡">♡</option><option value="🧘">🧘</option><option value="📖">📖</option>
                  <option value="💧">💧</option><option value="☕">☕</option><option value="🏃">🏃</option>
                </select>
                <button type="submit" class="primary-button">Shto</button>
              </div>
            </form>
          </div>
        </details>
      </section>
    `;
  }

  function generateWeeklyChartHTML() {
    const daysAlb = ["Die", "Hën", "Mar", "Mër", "Enj", "Pre", "Sht"];
    const past7Days = [];
    
    for (let i = 6; i >= 0; i--) {
      const dateStr = today(-i);
      const dObj = new Date();
      dObj.setDate(dObj.getDate() - i);
      const dayName = daysAlb[dObj.getDay()];
      const dayMins = state.focusRecords.filter(r => r.date === dateStr).reduce((a, b) => a + (b.minutes || 0), 0);
      past7Days.push({ date: dateStr, day: dayName, mins: dayMins, isToday: i === 0 });
    }

    const maxMins = Math.max(30, ...past7Days.map(d => d.mins));
    const totalWeekMins = past7Days.reduce((a, b) => a + b.mins, 0);
    const avgDailyMins = Math.round(totalWeekMins / 7);

    return `
      <div class="focus-chart-card stagger-in">
        <div class="chart-header">
          <div>
            <p class="eyebrow">STATISTIKAT E FOKUSIT</p>
            <b style="font-size: 18px; display: block;">Ritmi Javor i Studimit</b>
            <small style="color: var(--text-muted);">Minutat e përqendrimit në 7 ditët e fundit</small>
          </div>
          <span class="badge-tag" style="font-size: 12px;">📊 ${totalWeekMins} min gjithsej</span>
        </div>

        <div class="chart-bars-container">
          ${past7Days.map(d => {
            const heightPercent = Math.max(8, Math.round((d.mins / maxMins) * 100));
            return `
              <div class="chart-bar-col ${d.isToday ? 'today' : ''}">
                <div class="chart-bar-wrap">
                  <div class="chart-bar" style="height: ${heightPercent}%;">
                    <span class="chart-bar-val">${d.mins}m</span>
                  </div>
                </div>
                <span class="chart-bar-day">${d.day}</span>
              </div>
            `;
          }).join("")}
        </div>

        <div class="chart-summary-row">
          <span>Mesatarja ditore: <b>${avgDailyMins} min/ditë</b></span>
          <span>Dita më aktive: <b>${Math.max(...past7Days.map(d => d.mins))} min</b></span>
        </div>
      </div>
    `;
  }

  /* ==========================================================================
     Central Render (Full Shell on Route Change ONLY)
     ========================================================================== */
  function render() {
    if (appLocked) {
      renderLockScreen();
      return;
    }
    const current = route();
    const screenMap = {
      home: homeScreen,
      study: studyScreen,
      plan: planScreen,
      journal: journalScreen,
      life: routineScreen,
      routine: routineScreen,
      profile: profileScreen
    };
    const screenFn = screenMap[current] || homeScreen;
    document.getElementById("app").innerHTML = shell(screenFn(), current);
  }
