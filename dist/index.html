              <a href="#profile" class="profile-pill ${currentRoute === 'profile' ? 'active' : ''}">
                <img src="${PROFILE_IMG_SRC}" alt="Emma Gashi" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23fae7ee%22/><text x=%2250%22 y=%2258%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22%23cf5e8c%22>🌷</text></svg>'">
                <span>Emma</span>
              </a>
            </div>
            ${DEV_DEMO_ACTIVE?`<div class="demo-notice"><span><b>Demo</b> · Të dhëna prove</span><button type="button" id="btn-exit-demo" class="demo-exit-link">Dil nga demo</button></div>`:''}
          </header>
          </div>

          <!-- Main Dynamic Screen -->
          <div id="screen-container">
            ${contentHTML}
          </div>

          <!-- Bottom Floating Glass Navigation -->
          <nav class="glass-nav" aria-label="Navigimi kryesor">
            ${navItems.map(([key, icon, label]) => `
              <a href="#${key}" class="nav-item ${key === currentRoute ? 'active' : ''}">
                <span class="nav-icon">${icon}</span>
                <span>${label}</span>
                ${key === 'study' && pendingCount > 0 ? '<span class="nav-badge"></span>' : ''}
              </a>
              ${key === 'study' && currentRoute === 'study' ? `
                <button id="${studyAddAction.id}" class="nav-add-button" type="button" aria-label="${studyAddAction.label}" title="${studyAddAction.label}">
                  <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <path d="M10 4v12M4 10h12"></path>
                  </svg>
                </button>
              ` : ''}
            `).join("")}
          </nav>
        </div>

        <!-- Global Confirm Modal Overlay -->
        <div id="confirm-overlay" class="confirm-overlay hidden"></div>
      </main>
    `;
  }

  /* ==========================================================================
     Central Render (Full Shell on Route Change ONLY)
     ========================================================================== */
  function render() {
    journalEditor?.destroy();
    journalEditor = null;
    if (routinePeriodTimer !== null) {
      clearInterval(routinePeriodTimer);
      routinePeriodTimer = null;
    }
    if (schoolPdfSession) clearSchoolPdfSession();
    if (homeSchoolLessonTimer !== null) {
      clearInterval(homeSchoolLessonTimer);
      homeSchoolLessonTimer = null;
    }
    if(signingOut){renderSigningOut();return;}
    if (!hasWorkspaceAccess() || sessionExited) {
      renderSignedOutScreen();
      return;
    }
    if (appLocked) {
      authView?.destroy();authView=null;
      renderLockScreen();
      return;
    }
    const current = route();
    authView?.destroy();authView=null;
    const screenMap = {
      home: homeScreen,
      study: studyScreen,
      plan: planScreen,
      journal: journalScreen,
      life: routineScreen,
      routine: routineScreen,
      profile: profileScreen
    };
    const screenFn = screenMap[current] || homeScreen;
    document.getElementById("app").innerHTML = shell(screenFn(), current);
    if (screenFn === journalScreen) {
      journalEditor = EmmaJournalEditor.mount(document.getElementById("journal-body"), {
        content: ensureJournalDraft().content,
        photos: () => pendingJournalPhotos,
        onChange: content => { ensureJournalDraft().content = content; updateJournalCount(content); stashJournalDraft(); },
        onRemove: removeJournalPhoto
      });
      updateJournalCount();
    }
    if (screenFn === routineScreen) {
      syncRoutinePeriod(true);
      routinePeriodTimer = setInterval(syncRoutinePeriod, 30000);
    }
    if (screenFn === homeScreen) {
      updateHomeSchoolLesson();
      homeSchoolLessonTimer = setInterval(updateHomeSchoolLesson, 1000);
    }
  }

  /* ==========================================================================
     In-Place Partial DOM Updaters (0% Refresh Architecture)
     ========================================================================== */
  function updateHomeHubStats() {
    const routinePercent = routineProgress();
    document.querySelectorAll(".routine-ico ~ .badge-tag").forEach(el => el.textContent = `${routinePercent}% e kryer`);
    document.querySelectorAll(".hub-card .progress-bar").forEach(el => el.style.width = `${routinePercent}%`);
    
    const todayFocus = state.focusRecords.filter(r => r.date === today()).reduce((a, b) => a + (b.minutes || 0), 0);
    document.querySelectorAll(".focus-ico ~ .badge-tag").forEach(el => el.textContent = `${todayFocus} min sot`);
  }

  
  function updateRoutineProgressDOM() {
    const percent = routineProgress();

    const bar = document.querySelector(".routine-screen .progress-bar");
    if (bar) bar.style.width = `${percent}%`;

    const percentText = document.querySelector(".routine-screen .hub-card b");
    if (percentText) percentText.textContent = `${percent}% e përfunduar`;
    document.querySelectorAll(".routine-time-block").forEach(group => {
      const pending = group.querySelectorAll(".routine-row:not(.done)").length;
      const count = group.querySelector("summary small");
      if (count) count.textContent = `${pending} për të bërë`;
    });
  }

  function toggleRoutineInPlace(idx, el) {
    const wasDone = state.completed.includes(idx);
    state.completed = wasDone ? state.completed.filter(i => i !== idx) : [...state.completed, idx];
    save();
    
    if (el) {
      if (wasDone) {
        el.classList.remove("done");
        const statusSpan = el.querySelector(".routine-check");
        if (statusSpan) statusSpan.textContent = "○";
      } else {
        el.classList.add("done");
        const statusSpan = el.querySelector(".routine-check");
        if (statusSpan) statusSpan.textContent = "✓";
        playSound("complete");
        bloomToast("Një premtim i vogël ndaj vetes u mbajt. Shumë bukur ♡");
      }
    }
    updateHomeHubStats();
    updateRoutineProgressDOM();
  }

  function toggleCustomRoutineInPlace(rId, el) {
    const doneList = state.customRoutineDone || [];
    const wasDone = doneList.includes(rId);
    state.customRoutineDone = wasDone ? doneList.filter(i => i !== rId) : [...doneList, rId];
    save();

    if (el) {
      if (wasDone) {
        el.classList.remove("done");
        const statusSpan = el.querySelector(".routine-check");
        if (statusSpan) statusSpan.textContent = "○";
      } else {
        el.classList.add("done");
        const statusSpan = el.querySelector(".routine-check");
        if (statusSpan) statusSpan.textContent = "✓";
        playSound("complete");
        bloomToast("Zakon i bukur i përfunduar ♡");
      }
    }
    updateHomeHubStats();
    updateRoutineProgressDOM();
  }

  function completeTaskInPlace(taskId, itemEl) {
    const task = state.studyTasks.find(t => t.id === taskId);
    if (!task) return;
    task.completed = true;
    save();

    playSound("complete");
    bloomToast("Shkëlqyeshëm, Emma! Një detyrë më pak në mendjen tënde. ✦", "🌟");

    if (itemEl) {
      itemEl.classList.add("removing");
      setTimeout(() => {
        itemEl.remove();
      }, 200);
    }
  }

  /* ==========================================================================
     Global Delegated Event Listeners (Zero-Refresh)
     ========================================================================== */
  document.addEventListener("pointerdown", event => {
    if (event.target.closest("[data-journal-upload], [data-place-photo], [data-format]")) journalEditor?.remember();
  });
  document.addEventListener("focusin", event => {
    const more = document.querySelector(".journal-more-options[open]");
    if (more && !more.contains(event.target)) more.open = false;
  });
  document.addEventListener("click", (event) => {
    if(DEV_DEMO_ACTIVE&&event.target.closest('#btn-exit-demo')){logOut();return;}
    if(signingOut || !hasWorkspaceAccess() || sessionExited || appLocked)return;
    if(event.target.closest('#btn-log-out,#btn-exit-demo')){logOut();return;}
    if(event.target.closest('#btn-undo-import')) {
      if(recoverySnapshot)showConfirm('Kthe gjendjen e mëparshme','Të dhënat para rikthimit do të rikthehen. Gjendja aktuale do të ruhet si pikë kthimi.',async()=>{try{await replaceWithRecovery(normalizeState(recoverySnapshot));bloomToast('Gjendja e mëparshme u rikthye.');}catch{bloomToast('Rikthimi nuk u krye. Të dhënat nuk u prekën.','⚠️');}},'Ktheje');
      return;
    }
    const editHabit=event.target.closest('[data-edit-routine]');if(editHabit){editRoutine(editHabit.dataset.editRoutine);return;}
    const selectHome=event.target.closest('[data-select-home], [data-unselect-home]');
    if(selectHome) {
      const key=selectHome.dataset.selectHome || selectHome.dataset.unselectHome;
      const items=EmmaSpaceModel.home(state,today());
      let keys=items.selected.map(item=>item.key);
      if(keys.includes(key)) keys=keys.filter(item=>item!==key);
      else if(keys.length<3)keys.push(key);
      else {bloomToast('Zgjidh deri në tri gjëra. Hiqe njërën për ta ndërruar.');return;}
      state.homePrioritySelection[today()]=keys;save();render();
      if(selectHome.dataset.selectHome)document.querySelector('.home-priority-picker')?.setAttribute('open','');
      return;
    }
    const journalMore = document.querySelector(".journal-more-options[open]");
    if (journalMore && !journalMore.contains(event.target)) journalMore.open = false;
    if (event.target.closest("#header-theme-btn")) {
      applyTheme(state.theme === "light-blush" ? "midnight-velvet" : "light-blush");
      save();
      return;
    }

    const setThemeBtn = event.target.closest("[data-set-theme]");
    if (setThemeBtn) {
      applyTheme(setThemeBtn.dataset.setTheme);
      save();
      render();
      bloomToast("Pamja u ruajt ✦");
      return;
    }

    const priorityToggle = event.target.closest("[data-toggle-priority]");
    if (priorityToggle) {
      const item = state.priorities.find(priority => priority.id === priorityToggle.dataset.togglePriority);
      if (item) item.completed = !item.completed;
      save();
      render();
      return;
    }

    const priorityDelete = event.target.closest("[data-delete-priority]");
    if (priorityDelete) {
      state.priorities = state.priorities.filter(priority => priority.id !== priorityDelete.dataset.deletePriority);
      save();
      render();
      return;
    }

    const homeTaskToggle = event.target.closest("[data-toggle-home-task]");
    if (homeTaskToggle) {
      const task = state.studyTasks.find(item => item.id === homeTaskToggle.dataset.toggleHomeTask);
      if (task) task.completed = !task.completed;
      save();
      render();
      return;
    }

    const homeTaskDelete = event.target.closest("[data-delete-home-task]");
    if (homeTaskDelete) {
      const taskId = homeTaskDelete.dataset.deleteHomeTask;
      showConfirm("Fshi Detyrën", "A dëshiron ta fshish këtë detyrë nga plani?", () => {
        state.studyTasks = state.studyTasks.filter(task => task.id !== taskId);
        save();
        render();
        bloomToast("Detyra u fshi.");
      }, "Po, fshije");
      return;
    }

    const goStudyTab = event.target.closest("[data-go-study-tab]");
    if (goStudyTab) {
      activeStudyTab = goStudyTab.dataset.goStudyTab || "plan";
      navigate("study");
      setTimeout(() => {
        if (activeStudyTab === "exams") showQuickExamModal();
        else if (activeStudyTab === "subjects") showQuickSubjectModal();
        else showQuickTaskModal();
      }, 80);
      return;
    }

    const removePendingPhoto = event.target.closest("[data-remove-pending-photo]");
    if (removePendingPhoto) {
      removeJournalPhoto(removePendingPhoto.dataset.removePendingPhoto);
      return;
    }

    const placePhoto = event.target.closest("[data-place-photo]");
    if (placePhoto) {
      const photo = pendingJournalPhotos.find(item => item.id === placePhoto.dataset.placePhoto);
      if (photo) journalEditor?.insertPhoto(photo);
      return;
    }

    const editPageBtn = event.target.closest("[data-edit-page]");
    if (editPageBtn) {
      const page = state.journalPages.find(item => item.id === editPageBtn.dataset.editPage);
      if (!page) return;
      editingJournalId = page.id;
      currentMood = page.mood || "😌 E qetë";
      pendingJournalPhotos = JSON.parse(JSON.stringify(page.photos || []));
      journalDraft = { title: page.title || "", content: EmmaJournalEditor.normalize(page.content, page.body, pendingJournalPhotos) };
      stashJournalDraft();
      render();
      setTimeout(() => {
        document.querySelector(".journal-compose-card")?.scrollIntoView({ behavior: "smooth", block: "start" });
        document.getElementById("journal-title")?.focus();
      }, 50);
      return;
    }

    if (event.target.closest("#cancel-journal-edit")) {
      clearJournalDraft();
      save();
      currentMood = "😌 E qetë";
      render();
      return;
    }

    if (event.target.closest("#btn-lock-now")) {
      lockApp();
      return;
    }

    if (event.target.closest("#btn-remove-pin")) {
      showConfirm("Hiqe PIN-in", "Emma’s Space do të hapet pa PIN në këtë pajisje.", async () => {
        state.pin = blankState().pin;
        await save();
        resetAutoLockTimer();
        render();
        bloomToast("PIN-i u hoq.");
      }, "Po, hiqe");
      return;
    }

    // Subject notes and Anki-style flashcards
    const openSubjectToolsBtn = event.target.closest("[data-open-subject-tools]");
    if (openSubjectToolsBtn) {
      activeSubjectWorkspaceId = openSubjectToolsBtn.dataset.openSubjectTools;
      activeSubjectNoteDate = studyDayKey();
      studyReviewSubjectId = null;
      studyReviewQueue = [];
      studyReviewAnswerShown = false;
      render();
      setTimeout(() => document.querySelector("[data-subject-workspace]")?.scrollIntoView({ behavior: "smooth", block: "start" }), 40);
      return;
    }

    if (event.target.closest("#btn-close-subject-tools")) {
      activeSubjectWorkspaceId = null;
      activeSubjectNoteDate = studyDayKey();
      studyReviewSubjectId = null;
      studyReviewQueue = [];
      studyReviewAnswerShown = false;
      render();
      return;
    }

    const subjectNoteDateBtn = event.target.closest("[data-subject-note-date]");
    if (subjectNoteDateBtn) {
      activeSubjectNoteDate = subjectNoteDateBtn.dataset.subjectNoteDate || studyDayKey();
      render();
      setTimeout(() => document.getElementById("subject-notes-text")?.focus(), 30);
      return;
    }

    const startReviewBtn = event.target.closest("[data-start-flashcard-review]");
    if (startReviewBtn) {
      const subjectId = startReviewBtn.dataset.startFlashcardReview;
      const dueCards = subjectDueCards(subjectId);
      const cards = dueCards.length ? dueCards : subjectCards(subjectId);
      studyReviewSubjectId = subjectId;
      studyReviewQueue = cards.map(card => card.id);
      studyReviewAnswerShown = false;
      render();
      return;
    }

    if (event.target.closest("#btn-reveal-flashcard")) {
      studyReviewAnswerShown = true;
      const workspace = document.querySelector("[data-subject-workspace]");
      if (workspace && activeSubjectWorkspaceId) {
        const subject = state.subjects.find(item => item.id === activeSubjectWorkspaceId);
        workspace.outerHTML = subjectStudyWorkspace(subject);
      }
      return;
    }

    if (event.target.closest("#btn-stop-flashcard-review")) {
      studyReviewSubjectId = null;
      studyReviewQueue = [];
      studyReviewAnswerShown = false;
      render();
      return;
    }

    const rateFlashcardBtn = event.target.closest("[data-rate-flashcard]");
    if (rateFlashcardBtn) {
      const cardId = rateFlashcardBtn.dataset.cardId;
      const rating = rateFlashcardBtn.dataset.rateFlashcard;
      const card = (state.flashcards || []).find(item => item.id === cardId);
      if (!card) return;

      card.reviews = Number(card.reviews || 0) + 1;
      card.ease = Number(card.ease || 2.3);
      card.interval = Math.max(0, Number(card.interval || 0));
      card.lastReviewedAt = new Date().toISOString();

      if (rating === "again") {
        card.lapses = Number(card.lapses || 0) + 1;
        card.interval = 0;
        card.ease = Math.max(1.3, card.ease - 0.2);
        card.dueDate = studyDayKey();
      } else if (rating === "hard") {
        card.interval = 1;
        card.ease = Math.max(1.3, card.ease - 0.05);
        card.dueDate = studyAddDays(1);
      } else {
        card.interval = Math.max(2, Math.round(Math.max(1, card.interval) * card.ease));
        card.ease = Math.min(3, card.ease + 0.05);
        card.dueDate = studyAddDays(card.interval);
      }

      studyReviewQueue.shift();
      if (rating === "again" && studyReviewQueue.length) studyReviewQueue.push(cardId);
      studyReviewAnswerShown = false;
      save();
      render();
      return;
    }

    const deleteFlashcardBtn = event.target.closest("[data-delete-flashcard]");
    if (deleteFlashcardBtn) {
      const cardId = deleteFlashcardBtn.dataset.deleteFlashcard;
      showConfirm("Fshi kartelën", "Kjo pyetje dhe përgjigje do të hiqen nga lënda.", () => {
        state.flashcards = (state.flashcards || []).filter(card => card.id !== cardId);
        studyReviewQueue = studyReviewQueue.filter(id => id !== cardId);
        save();
        render();
        bloomToast("Kartela u fshi.");
      });
      return;
    }

    // Journal Save Button Click
    if (event.target.closest("#save-journal-entry")) {
      saveJournalEntry();
      return;
    }

    // 3. Sound Toggle
    if (event.target.closest("#header-sound-btn") || event.target.closest("#btn-toggle-sound")) {
      state.soundEnabled = !state.soundEnabled;
      save();
      const soundBtns = [document.getElementById("header-sound-btn"), document.getElementById("btn-toggle-sound")];
      soundBtns.forEach(btn => {
        if (!btn) return;
        if (btn.id === "header-sound-btn") {
          btn.innerHTML = uiLineIcon(state.soundEnabled ? "bell" : "bellOff", 19);
          btn.setAttribute("aria-pressed", String(state.soundEnabled));
        }
        if (btn.id === "btn-toggle-sound") {
          btn.textContent = state.soundEnabled ? "🔔 Aktiv" : "🔕 Heshtur";
          btn.className = state.soundEnabled ? "primary-button" : "subtle-button";
        }
      });
      bloomToast(state.soundEnabled ? "Tingujt u aktivizuan 🔔" : "Tingujt u heshtën 🔕");
      return;
    }

    
    // Focus Launcher Trigger: Opens the Duration & Mode Selector (with active guard)
    if (event.target.closest("[data-open-focus-arena], [data-quick-focus], #btn-open-focus-picker")) {
      checkActiveFocusBeforeNew(() => {
        showFocusPickerModal();
      });
      return;
    }

    
    // Choose Display Mode in Modal
    const modeBtn = event.target.closest("[data-choose-mode]");
    if (modeBtn) {
      document.querySelectorAll("[data-choose-mode]").forEach(b => b.classList.remove("selected"));
      modeBtn.classList.add("selected");
      selectedFocusMode = modeBtn.dataset.chooseMode;
      return;
    }

    
    // Hero Pomodoro Card Actions in Home Screen
    if (event.target.closest("#hero-pomo-toggle")) {
      const toggle = document.getElementById("focus-toggle");
      if (toggle) {
        toggle.click();
      } else {
        if (focus.active) {
          clearInterval(focus.timer);
          focus.active = false;
          persistFocusSession();
          updateTimerDOM();
        } else {
          focus.active = true;
          persistFocusSession();
          focus.timer = setInterval(() => {
            focus.seconds -= 1;
            updateTimerDOM();
            if (focus.seconds <= 0) finishFocusSession();
          }, 1000);
          updateTimerDOM();
        }
      }
      return;
    }

    if (event.target.closest("#hero-pomo-expand")) {
      openFocusFullscreen();
      updateArenaDOM();
      return;
    }

    if (event.target.closest("#hero-pomo-stop")) {
      showConfirm("Ndalo Sesionin", "A dëshiron ta ndalosh dhe mbyllësh kohëmatësin?", () => {
        clearInterval(focus.timer);
        focus.active = false;
        focus.seconds = focus.minutes * 60;
        clearFocusSession();
        updateTimerDOM();
        bloomToast("Sesioni i fokusit u mbyll.");
      }, "Po, ndaloje");
      return;
    }

    // Mini-Timer Pill Actions
    if (event.target.closest("#mini-expand-focus, [data-expand-focus-fullscreen]")) {
      openFocusFullscreen();
      updateArenaDOM();
      return;
    }

    if (event.target.closest("#mini-toggle-focus")) {
      const toggle = document.getElementById("focus-toggle");
      if (toggle) toggle.click();
      return;
    }

    if (event.target.closest("#mini-close-focus")) {
      showConfirm("Ndalo Sesionin", "A dëshiron ta ndalosh dhe mbyllësh kohëmatësin?", () => {
        clearInterval(focus.timer);
        focus.active = false;
        focus.seconds = focus.minutes * 60;
        clearFocusSession();
        updateTimerDOM();
        bloomToast("Sesioni i fokusit u mbyll.");
      }, "Po, ndaloje");
      return;
    }

    // Choose Minutes in Modal (Presets)
    const chooseMinBtn = event.target.closest("[data-choose-mins]");
    if (chooseMinBtn) {
      const mins = Number(chooseMinBtn.dataset.chooseMins) || 25;
      updateFocusModalMins(mins, false);
      playSound("click");
      return;
    }

    // Toggle Custom Minutes in Modal
    if (event.target.closest("#btn-toggle-custom-mins")) {
      const customRow = document.getElementById("custom-mins-inline-row");
      const isHidden = customRow && customRow.classList.contains("hidden");
      if (isHidden) {
        updateFocusModalMins(selectedFocusMins || 30, true);
        const input = document.getElementById("input-custom-focus-mins");
        if (input) {
          setTimeout(() => {
            input.focus();
            input.select();
          }, 60);
        }
      } else {
        updateFocusModalMins(selectedFocusMins || 25, false);
      }
      playSound("click");
      return;
    }

    // Custom Stepper Buttons
    if (event.target.closest("#btn-custom-minus-5")) {
      updateFocusModalMins(selectedFocusMins - 5, true);
      playSound("click");
      return;
    }
    if (event.target.closest("#btn-custom-minus-1")) {
      updateFocusModalMins(selectedFocusMins - 1, true);
      playSound("click");
      return;
    }
    if (event.target.closest("#btn-custom-plus-1")) {
      updateFocusModalMins(selectedFocusMins + 1, true);
      playSound("click");
      return;
    }
    if (event.target.closest("#btn-custom-plus-5")) {
      updateFocusModalMins(selectedFocusMins + 5, true);
      playSound("click");
      return;
    }

    // Choose Ambient in Modal
    const chooseAmbBtn = event.target.closest("[data-choose-ambient]");
    if (chooseAmbBtn) {
      document.querySelectorAll("[data-choose-ambient]").forEach(b => b.classList.remove("selected"));
      chooseAmbBtn.classList.add("selected");
      selectedFocusAmbient = chooseAmbBtn.dataset.chooseAmbient;
      playSound("click");
      return;
    }

    if (event.target.closest("#btn-start-quick-focus")) {
      launchFocusSession(25, "none", selectedFocusSubject || "", "fullscreen");
      return;
    }

    // Start Chosen Focus Session
    if (event.target.closest("#btn-start-chosen-focus")) {
      const subSelect = document.getElementById("modal-focus-subject");
      const subId = subSelect ? subSelect.value : "";
      launchFocusSession(selectedFocusMins, selectedFocusAmbient, subId, selectedFocusMode);
      return;
    }

    
    // Fullscreen Focus Arena Triggers
    if (event.target.closest("#btn-open-fullscreen-focus")) {
      openFocusFullscreen();
      return;
    }

    if (event.target.closest("#arena-exit-btn")) {
      closeFocusFullscreen();
      return;
    }

    if (event.target.closest("#arena-toggle-btn")) {
      const toggle = document.getElementById("focus-toggle");
      if (toggle) toggle.click();
      updateArenaDOM();
      return;
    }

    if (event.target.closest("#arena-sub-5m")) {
      if (focus.seconds > 300) {
        focus.seconds -= 300;
        focus.minutes = Math.max(1, Math.ceil(focus.seconds / 60));
        persistFocusSession();
        updateTimerDOM();
        updateArenaDOM();
        playSound("click");
        bloomToast("U zbritën -5 minuta fokus ⏱️");
      } else {
        bloomToast("Sesioni është afër përfundimit ⏱️", "⚠️");
      }
      return;
    }

    if (event.target.closest("#arena-add-5m")) {
      focus.seconds += 300;
      focus.minutes = Math.ceil(focus.seconds / 60);
      persistFocusSession();

  document.addEventListener("submit", async (event) => {
    if(signingOut || !hasWorkspaceAccess() || sessionExited || (appLocked && event.target.id!=='unlock-form')){event.preventDefault();return;}
    if(event.target.id==='routine-settings-form') {

      state.routineSettings[event.target.dataset.routineKey]=EmmaSpaceModel.schedule({label,period:data.get('period'),days});
      await save();closeCustomModal();render();bloomToast('Zakoni u përditësua.');return;
    }
    event.preventDefault();
    if (event.target.id === "school-lesson-form") {

      const submitButton = document.getElementById("school-lesson-submit");
      if (submitButton?.disabled) return;
      const lesson = {
        id: form.dataset.lessonId || id("lesson"),
        day: Number(document.getElementById("school-lesson-day")?.value),
        subject: document.getElementById("school-lesson-subject")?.value.trim() || "",
        startTime: document.getElementById("school-lesson-start")?.value || "",
        endTime: document.getElementById("school-lesson-end")?.value || "",
        room: document.getElementById("school-lesson-room")?.value.trim() || "",
        isExample: false
      };
      const error = schoolLessonError(lesson);
      const errorMessage = document.getElementById("school-lesson-error");
      if (errorMessage) {
        errorMessage.textContent = error;
        errorMessage.classList.toggle("show", Boolean(error));
      }
      if (error) {
        document.getElementById(!lesson.subject ? "school-lesson-subject" : "school-lesson-end")?.focus();
        return;
      }
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = "Duke ruajtur…";
      }
      const index = state.schoolSchedule.lessons.findIndex(item => item.id === lesson.id);
      if (index >= 0) state.schoolSchedule.lessons[index] = lesson;
      else state.schoolSchedule.lessons.push(lesson);
      state.schoolSchedule.isExample = state.schoolSchedule.lessons.some(item => item.isExample);
      activeScheduleDay = lesson.day;
      await save();
      closeCustomModal();
      render();
      bloomToast("✓ U vendos!");
      return;

      if (!input || !/^\d{6}$/.test(input.value)) {
        if (error) error.textContent = "Vendos 6 shifra.";
        return;
      }
      const result = await tryUnlock(input.value);
      if (!result.ok && error) {
        error.textContent = result.message;
        input.value = "";
        input.focus();
      }
      return;

        type: "Detyrë",
        dueDate,
        minutes,
        confidence: "ne-rregull",
        completed: false,
        createdAt: Date.now(),
        dueTime
      };

      state.studyTasks.unshift(newTask);
      await save();

      titleInput.value = "";
      quickTaskDirty = true;
      const successMessage = document.getElementById("quick-task-success");
      if (successMessage) {
        successMessage.textContent = "✓ U vendos!";
        successMessage.classList.add("show");
      }
      if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent = "Shto detyrën";
      }
      updateQuickTaskConflictWarning();
      titleInput.focus();

      playSound("complete");
      bloomToast("Detyra u shtua me sukses në plan! ✦", "📖");
      return;
    }

    // 2. Exam Form Submit
    if (event.target.id === "exam-form") {
      const titleInput = document.getElementById("exam-title");
      const subjectSelect = document.getElementById("exam-subject");
      const dtInput = document.getElementById("exam-datetime");
      const locInput = document.getElementById("exam-location");
      const notesInput = document.getElementById("exam-notes");

      if (!titleInput || !subjectSelect || !dtInput) return;
      const title = titleInput.value.trim();
      const subjectId = subjectSelect.value;
      const dateTime = dtInput.value;
      const location = locInput ? locInput.value.trim() : "";
      const notes = notesInput ? notesInput.value.trim() : "";

      if (!title || !dateTime) {
        bloomToast("Të lutem vendos emrin dhe datën/orën e provimit.", "⚠️");
        return;
      }

      const newExam = {
        id: id("exam"),
        title,
        subjectId,
        dateTime,
        location,
        notes,
        completed: false
      };

      if (!Array.isArray(state.exams)) state.exams = [];
      state.exams.push(newExam);
      save();

      document.getElementById("exam-form")?.classList.add("hidden");
      playSound("complete");
      bloomToast("Provimi u shtua me sukses! 🎯");
      render();
      return;
    }

    // 3. Subject Form Submit
    if (event.target.id === "subject-form") {
      const input = document.getElementById("study-subject");
      const name = input ? input.value.trim() : "";
      if (!name) return;

      const newSub = {
        id: id("sub"),
        name,
        icon: selectedSubjectIcon || "📚",
        color: "var(--rose)"
      };
      state.subjects.push(newSub);
      save();

      if (input) input.value = "";
      document.getElementById("subject-form")?.classList.add("hidden");
      playSound("complete");
      bloomToast("Lënda u shtua me sukses! 📚");
      render();
      return;
    }

    

    // 4. Custom Routine Form
    if (event.target.id === "custom-routine-form") {
      const input = document.getElementById("custom-routine-label");
      const icon = document.getElementById("custom-routine-icon").value || "🌸";
      const label = input.value.trim();
      if (!label) return;

      const newR = { id: id("routine"), label, icon };
      const selectedDays=[...event.target.querySelectorAll('[name="day"]:checked')].map(input=>Number(input.value));
      if(!selectedDays.length){bloomToast('Zgjidh së paku një ditë.');return;}
      state.routineSettings['c:'+newR.id]={label,period:document.getElementById('custom-routine-period').value,days:selectedDays};
      state.customRoutines.push(newR);
      save();

      input.value = "";
      bloomToast("Zakon i ri u shtua me sukses! 🌸");
      render();
      return;
    }

  });

  

  /* ==========================================================================
     Input Listeners (Journal Char Count, Search, Custom Pomodoro Mins)
     ========================================================================== */
  document.addEventListener("input", (event) => {
    if (event.target.id === "journal-title") {ensureJournalDraft().title = event.target.value;stashJournalDraft();}

    if (event.target.id === "journal-search") {
      const q = event.target.value.trim().toLowerCase();
      document.querySelectorAll(".journal-page-card").forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? "" : "none";
      });
    }

    if (event.target.id === "input-custom-focus-mins") {
      const val = parseInt(event.target.value, 10);
      if (!isNaN(val) && val >= 1 && val <= 180) {
        updateFocusModalMins(val, true);
      }
    }
  });

  document.addEventListener("change", async (event) => {
    if (event.target.id === "subject-note-date") {
      activeSubjectNoteDate = event.target.value || studyDayKey();
      render();
      setTimeout(() => document.getElementById("subject-notes-text")?.focus(), 30);
      return;
    }
    if (event.target.id === "input-custom-focus-mins") {
      let val = parseInt(event.target.value, 10);
      if (isNaN(val) || val < 1) val = 25;
      if (val > 180) val = 180;
      updateFocusModalMins(val, true);
    }

    if (event.target.id === "journal-photo-input" && event.target.files?.length) {
      const targetDraft = ensureJournalDraft();
      const available = Math.max(0, 4 - pendingJournalPhotos.length);
      const selected = Array.from(event.target.files).slice(0, available);
      if (!available) {
        bloomToast("Mund të ruash deri në 4 fotografi për çdo faqe.", "⚠️");
        event.target.value = "";
        return;
      }
      try {
        const processed = await Promise.all(selected.map(compressJournalPhoto));
        if (journalDraft !== targetDraft) return;
        const added = processed.slice(0, Math.max(0, 4 - pendingJournalPhotos.length));
        pendingJournalPhotos.push(...added);
        added.forEach(photo => {
          if (journalEditor) journalEditor.insertPhoto(photo);
          else targetDraft.content.push({type:"photo",photoId:photo.id,align:"center",width:65});
        });
        updateJournalPhotoPreview();
        stashJournalDraft();
        await save();
        if (added.length) bloomToast(added.length === 1 ? "Fotografia u shtua ♡" : `${added.length} fotografi u shtuan ♡`, "📷");
      } catch (error) {
        bloomToast(error?.message || "Fotografia nuk u shtua.", "⚠️");
      }
      event.target.value = "";
    }
  });

  
  
  
  // Global Keyboard Shortcuts Engine
  document.addEventListener("keydown", (event) => {
    if(signingOut || !hasWorkspaceAccess() || sessionExited || appLocked)return;
    // 1. ESCAPE: Always closes any open dialogs or fullscreens
    if (event.key === "Escape") {
      const confirmOverlay = document.getElementById("confirm-overlay");
      if (confirmOverlay && !confirmOverlay.classList.contains("hidden")) {
        if (confirmOverlay.classList.contains("quick-add-overlay")) return;
        confirmOverlay.classList.add("hidden");
        confirmOverlay.classList.remove("quick-add-overlay");
        confirmOverlay.innerHTML = "";
        return;
      }
      const arena = document.getElementById("fullscreen-focus-arena");
      if (arena && !arena.classList.contains("hidden") && !focusLocked) {
        closeFocusFullscreen();
        return;
      }
      return;
    }

    // 2. Ignore single-key navigation when user is actively typing in a form field
    const isTyping = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    
    // CTRL+ENTER / CMD+ENTER: Submit active form or journal
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      if (document.activeElement?.id === "journal-body" || document.activeElement?.id === "journal-title") {
        saveJournalEntry();
      }
      return;
    }

    if (isTyping) return;

    // 3. '?' or Shift + '/': Show Keyboard Shortcuts Help Modal
    if (event.key === "?" || (event.shiftKey && event.key === "/")) {
      event.preventDefault();
      showShortcutsModal();
      return;
    }

    // 4. Spacebar: Toggle Focus Timer
    if (event.code === "Space") {
      event.preventDefault();
      const arena = document.getElementById("fullscreen-focus-arena");
      if (arena && !arena.classList.contains("hidden")) {
        const toggle = document.getElementById("arena-toggle-btn");
        if (toggle) toggle.click();
      } else {
        const toggle = document.getElementById("focus-toggle");
        if (toggle) toggle.click();
      }
      return;
    }

    // 5. 'f' or 'F': Toggle Fullscreen Pomodoro Arena
    if (event.key.toLowerCase() === "f") {
      event.preventDefault();
      const arena = document.getElementById("fullscreen-focus-arena");
      if (arena && !arena.classList.contains("hidden")) {
        closeFocusFullscreen();
      } else {
        openFocusFullscreen();
      }
      return;
    }

    // 6. Navigation Numbers 1-6 or letters
    if (event.key === "1" || event.key.toLowerCase() === "h") {
      navigate("home");
      return;
    }
    if (event.key === "2" || event.key.toLowerCase() === "s") {
      navigate("study");
      return;
    }
    if (event.key === "3") {
      navigate("plan");
      return;
    }
    if (event.key === "4" || event.key.toLowerCase() === "j") {
      navigate("journal");
      return;
    }
    if (event.key === "5" || event.key.toLowerCase() === "r") {
      navigate("life");
      return;
    }
    if (event.key === "6" || event.key.toLowerCase() === "p") {
      navigate("profile");
      return;
    }

    // 7. 't' or 'T': Cycle through 5 Themes
    if (event.key.toLowerCase() === "t") {
      event.preventDefault();
      cycleTheme();
      return;
    }

    // 8. 'm' or 'M': Mute/Unmute Audio
    if (event.key.toLowerCase() === "m") {
      event.preventDefault();
      const soundBtn = document.getElementById("header-sound-btn");
      if (soundBtn) soundBtn.click();
      return;
    }

    // 9. 'n' or 'N': New Task Quick Adder
    if (event.key.toLowerCase() === "n") {
      event.preventDefault();
      navigate("study");
      setTimeout(() => {
        showQuickTaskModal();
      }, 100);
      return;
    }
  });

// Change Event Listeners (Ambient Sound, Arena Subject & Backup Import)
  document.addEventListener("change", async (event) => {
    if (event.target.id === "input-school-pdf" && event.target.files?.[0]) {
      const file = event.target.files[0];
      event.target.value = "";
      await loadSchoolPdf(file);
      return;
    }
    if (event.target.id === "arena-subject-select") {
      focus.subjectId = event.target.value;
      persistFocusSession();
      updateTimerDOM();
      bloomToast(`Lënda e fokusit u përditësua: ${getActiveSubjectName()} 📚`);
      return;
    }
    if (event.target.id === "arena-ambient-select") {
      startAmbientSound(event.target.value);
      return;
    }
    if (event.target.id === "input-backup-import" && event.target.files?.[0]) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const candidate = parseBackupPayload(parsed);
          const photos=candidate.journalPages.reduce((sum,page)=>sum+(page.photos?.length||0),0);
          showConfirm('Kontrollo kopjen',`${candidate.journalPages.length} kujtime · ${photos} fotografi\n${candidate.studyTasks.length} detyra · ${candidate.exams.length} provime\n${candidate.customRoutines.length} zakone personale\n\nKjo kopje do të zëvendësojë gjendjen aktuale. Para saj ruhet automatikisht një pikë kthimi në këtë pajisje.`,async()=>{try{await replaceWithRecovery(candidate);bloomToast('Kopja u rikthye. Gjendja e mëparshme mbetet e rikthyeshme.');}catch{bloomToast('Kopja nuk u rikthye. Të dhënat aktuale nuk u prekën.','⚠️');}},'Rikthe kopjen');
        } catch {
          bloomToast("Backup-i nuk është i vlefshëm. Të dhënat aktuale nuk u prekën.", "⚠️");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }
  });

  

  ["pointerdown", "touchstart"].forEach(eventName => {
    document.addEventListener(eventName, resetAutoLockTimer, { passive: true });
  });

  document.addEventListener("keydown", resetAutoLockTimer, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if(journalDraft){stashJournalDraft();save();}
      hiddenAt = Date.now();
      return;
    }
    if (focus.active && state.focusSession?.endAt) {
      focus.seconds = Math.max(0, Math.ceil((state.focusSession.endAt - Date.now()) / 1000));
      if (focus.seconds <= 0) finishFocusSession();
      else updateTimerDOM();
    }
    if (hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) lockApp();
    hiddenAt = 0;
    resetAutoLockTimer();
    updateHomeSchoolLesson();
    syncRoutinePeriod();
    if(hasWorkspaceAccess())verifyOnlineSession();
  });

  /* ==========================================================================
     Hash Change Route Handler & Init
     ========================================================================== */
  window.addEventListener("hashchange", () => {
    render();
    window.scrollTo({top: 0, left: 0, behavior: 'auto'});
  });

  let studyReminderShown = false;

  function showStudyReminderOnOpen() {
    if (studyReminderShown || !hasWorkspaceAccess() || sessionExited || appLocked || !state?.studyTasks?.length) return;
    const todayKey = today();
    const now = new Date();
    const currentTime = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    const task = state.studyTasks.find(item => {
      if (item.completed || item.dueDate !== todayKey) return false;
      return !item.dueTime || item.dueTime <= currentTime;
    });
    if (!task) return;

    const reminderKey = workspaceKey(`emma-study-reminder-${todayKey}-${task.id}`);
    try {
      if (sessionStorage.getItem(reminderKey)) {
        studyReminderShown = true;
        return;
      }
      sessionStorage.setItem(reminderKey, "1");
    } catch {
      // The reminder can still be shown when session storage is unavailable.
    }
    studyReminderShown = true;

    const subject = state.subjects.find(item => item.id === task.subjectId);
    const overlay = document.createElement("div");
    overlay.className = "study-reminder-overlay";
    overlay.innerHTML = `
      <section class="study-reminder-card" role="dialog" aria-modal="true" aria-labelledby="study-reminder-title">
        <div class="study-reminder-icon">${subject?.icon || "📚"}</div>
        <p class="study-reminder-kicker">Koha jote për studim</p>
        <h2 id="study-reminder-title" class="study-reminder-title">${escapeHTML(task.title)}</h2>
        <p class="study-reminder-meta">${subject ? `${subject.icon || "📚"} ${escapeHTML(subject.name)} · ` : ""}${task.dueTime ? `Ora ${escapeHTML(task.dueTime)} · ` : ""}${Number(task.minutes || 0)} minuta</p>
        <p class="study-reminder-message">Një hap i vogël tani të ndihmon shumë më vonë. Je gati? ♡</p>
        <div class="study-reminder-progress" aria-hidden="true"></div>
        <button type="button" class="subtle-button study-reminder-close">Vazhdo në hapësirën time</button>
      </section>
    `;
    document.body.appendChild(overlay);
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      overlay.classList.remove("show");
      setTimeout(() => overlay.remove(), 620);
    };
    overlay.querySelector(".study-reminder-close")?.addEventListener("click", close);
    requestAnimationFrame(() => overlay.classList.add("show"));
    setTimeout(close, 5200);
  }

  async function bootstrapApp() {
    const loadingStartedAt = performance.now();
    const minimumLoadingMs = 1100;
    document.getElementById("app").innerHTML = `
      <main class="emma-opening-screen" aria-busy="true">
        <section class="emma-opening-content" aria-labelledby="emma-opening-title">
          <div class="emma-opening-emblem" aria-hidden="true">
            <svg class="emma-opening-ring" viewBox="0 0 160 160" fill="none">
              <circle class="emma-opening-ring-track" cx="80" cy="80" r="77" stroke-width="1"/>
              <circle class="emma-opening-ring-arc" cx="80" cy="80" r="77" stroke-width="2" stroke-linecap="round" stroke-dasharray="165 319" transform="rotate(-90 80 80)"/>
            </svg>
            <div class="emma-opening-monogram"><span>E</span><svg class="emma-opening-spark" viewBox="0 0 20 20"><path d="M10 0C11 7 13 9 20 10C13 11 11 13 10 20C9 13 7 11 0 10C7 9 9 7 10 0Z"/></svg></div>
          </div>
          <h1 id="emma-opening-title">Emma’s Space</h1>
          <p class="emma-opening-subtitle">Një çast për ty.</p>
          <div class="emma-opening-status" role="status">
            <div class="emma-opening-bar" aria-hidden="true"></div>
            <p>Po hapet…</p>
          </div>
        </section>
        <p class="emma-opening-private"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" stroke-linecap="round"/></svg>Vetëm e jotja</p>
      </main>
    `;
    try {
      state = await loadPersistentState();
      storageReady = true;
    } catch {
      state = loadLegacyState();
      storageReady = false;
      localStorage.setItem(FALLBACK_KEY, JSON.stringify(state));
    }
    applyTheme(state.theme);
    const loadingTimeLeft = Math.max(0, minimumLoadingMs - (performance.now() - loadingStartedAt));
    if (loadingTimeLeft) await new Promise(resolve => setTimeout(resolve, loadingTimeLeft));
    restoreJournalDraft();
    if(EmmaSpaceModel.rollover(state,today())) await save();
    recoverySnapshot=await readRecoverySnapshot();
    if(DEV_DEMO_ACTIVE)sessionExited=false;
    if(!DEV_DEMO_ACTIVE&&authClient.configured&&(!sessionExited||window.EMMA_AUTH_CONFIG?.provider==='supabase'&&['code','error'].some(key=>new URL(location.href).searchParams.has(key)))){try{const result=await authClient.session();authStatus=result.status;authEmail=result.email||'';authEmailVerified=result.emailVerified===true;if(result.status!=='anonymous'){sessionExited=false;try{localStorage.removeItem(SIGNED_OUT_KEY);}catch{}}}catch(error){authNotice=error.message;authStatus='anonymous';}}
    if(sessionExited)authNotice='Për llogarinë ekzistuese, zgjidh “Hyr”.';
    appLocked = sessionExited || !!state.pin?.enabled;
    render();
    activatePrivateSession();

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  }

  bootstrapApp();

})();

  </script>
