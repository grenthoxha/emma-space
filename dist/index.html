/* ==========================================================================
   Global Reset & Balanced Proportions
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(clamp(0px, 2.5vw, 36px) + clamp(16px, 2.5vw, 28px) + 82px);
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg-page);
  color: var(--text-main);
  font-family: "DM Sans", "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.65;
  letter-spacing: 0.01em;
  transition: background 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent !important;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent !important;
}

a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
}

:focus {
  outline: none;
}

:focus-visible {
  outline: 2px solid var(--rose);
  outline-offset: 2px;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

h1, h2, h3, .font-serif {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 600;
  line-height: 1.22;
  color: var(--text-heading);
  letter-spacing: -0.02em;
}

.eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--text-eyebrow);
  margin-bottom: 6px;
}

/* ==========================================================================
   App Shell & Symmetrical Layout Containers
   ========================================================================== */
.app-background {
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(0px, 2.5vw, 36px);
  background: radial-gradient(circle at 0 0, var(--bg-radial-1) 0, transparent 40%),
              radial-gradient(circle at 100% 100%, var(--bg-radial-2) 0, transparent 35%),
              linear-gradient(135deg, var(--bg-linear-1), var(--bg-linear-2) 50%, var(--bg-linear-3));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.app-shell {
  width: min(1120px, 100%);
  min-height: calc(100vh - clamp(0px, 5vw, 72px));
  min-height: calc(100dvh - clamp(0px, 5vw, 72px));
  background: var(--bg-shell);
  border: 1px solid var(--shell-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shell-shadow);
  padding: clamp(16px, 2.5vw, 28px) clamp(16px, 3.5vw, 42px) calc(96px + env(safe-area-inset-bottom));
  position: relative;
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  overflow: hidden;
}

/* ==========================================================================
   Header Bar (Organized & Aligned)
   ========================================================================== */
.glass-header {
  position: fixed;
  top: calc(clamp(0px, 2.5vw, 36px) + clamp(16px, 2.5vw, 28px));
  left: 50%;
  width: min(calc(1120px - 2px - 2 * clamp(16px, 3.5vw, 42px)), calc(100% - 2 * clamp(0px, 2.5vw, 36px) - 2 * clamp(16px, 3.5vw, 42px) - 2px));
  z-index: 100;
  background: color-mix(in srgb, var(--header-glass) 95%, var(--rose) 5%);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: 12px clamp(12px, 1.8vw, 20px);
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: none;
  border-radius: 22px;
  box-shadow: 0 6px 24px color-mix(in srgb, var(--text-heading) 4%, transparent);
  transform: translateX(-50%);
  transition: background .3s ease, color .3s ease;
}

.header-slot {
  min-height: 66px;
  margin-bottom: clamp(20px, 3vw, 32px);
}

@media (max-width: 768px) {
  html { scroll-padding-top: calc(max(14px, env(safe-area-inset-top)) + 82px); }
  .glass-header { top: max(14px, env(safe-area-inset-top)); width: calc(100% - 28px); }
  .header-slot { min-height: calc(66px + max(0px, env(safe-area-inset-top) - 14px)); }
}

@media (min-width: 769px) and (max-width: 1024px) {
  html { scroll-padding-top: 118px; }
  .glass-header { top: 36px; width: calc(100% - 82px); }
}

@media print {
  .header-slot { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  .glass-header { transition-duration: .01ms; }
}

.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(14.5px, 2vw, 16.5px);
  font-weight: 500;
  color: var(--text-heading);
  white-space: nowrap;
  min-width: 0;
}

.wordmark .tulip-icon {
  font-size: clamp(20px, 2.8vw, 24px);
  display: inline-block;
  flex-shrink: 0;
}

@keyframes floatTulip {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-3px) rotate(4deg); }
}

.wordmark b {
  font-size: clamp(16.5px, 2.4vw, 19px);
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.6vw, 12px);
  flex-shrink: 0;
}

.date-pill {
  font-size: 11.5px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--badge-bg);
  color: var(--badge-text);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.icon-pill-btn {
  width: 38px;
  height: 38px;
  min-width: 38px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--subtle-btn-text);
  font-size: 16px;
  transition: var(--transition-smooth);
}
.icon-pill-btn:hover {
  background: var(--subtle-btn-hover);
  transform: translateY(-2px);
}



.profile-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 12px 3px 3px;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition: var(--transition-smooth);
}
.profile-pill img {
  width: 30px;
  height: 30px;
  min-width: 30px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 25%;
  border: 2px solid var(--paper);
}
.profile-pill {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  outline: none;
}
.profile-pill:active {
  transform: scale(0.95);
}
.profile-pill.active {
  background: var(--subtle-btn-hover);
  border-color: var(--rose);
}
@media (hover: hover) and (pointer: fine) {
  .profile-pill:hover {
    background: var(--subtle-btn-hover);
    border-color: var(--rose);
    transform: translateY(-2px);
  }
}

/* ==========================================================================
   Bottom Floating Navigation (Balanced & Symmetrical)
   ========================================================================== */
.glass-nav {
  position: fixed;
  left: 50%;
  bottom: max(12px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(600px, calc(100vw - 24px));
  z-index: 90;
  background: var(--nav-glass);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--shell-border);
  border-radius: var(--radius-full);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.16);
  padding: 5px 8px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent !important;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  color: var(--text-muted);
  font-size: clamp(10.5px, 2.4vw, 11.5px);
  font-weight: 600;
  transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  min-height: 46px;
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.nav-item:focus,
.nav-item:focus-visible,
.nav-item:visited {
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

.nav-item:active {
  transform: scale(0.92);
  transition: transform 0.08s ease;
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

.nav-item .nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  transition: transform 0.25s ease;
  pointer-events: none;
}

.nav-item .nav-icon svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
  transition: stroke 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}

.nav-item span {
  pointer-events: none;
}

@media (hover: hover) and (pointer: fine) {
  .nav-item:hover {
    color: var(--rose);
  }
  .nav-item:hover .nav-icon svg {
    transform: translateY(-2px);
    stroke: var(--rose);
  }
}

.nav-item.active {
  color: var(--primary-btn-text);
  background: linear-gradient(110deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  box-shadow: 0 6px 16px var(--rose-glow);
}
.nav-item.active .nav-icon svg {
  stroke: currentColor;
}

.nav-badge {
  position: absolute;
  top: 5px;
  right: calc(50% - 13px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rose);
  border: 2px solid var(--paper);
}

/* ==========================================================================
   Standardized Buttons & Form Controls (Consistent 44px Height)
   ========================================================================== */
.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 clamp(16px, 3vw, 24px);
  border-radius: var(--radius-md);
  background: linear-gradient(110deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  color: var(--primary-btn-text);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--primary-btn-shadow);
  transition: var(--transition-smooth);
  white-space: nowrap;
}
.primary-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 10px 24px var(--rose-glow);
}
.primary-button:active {
  transform: translateY(0);
}
.primary-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.hidden:not(.confirm-overlay) {
  display: none !important;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.primary-button.hidden,
.subtle-button.hidden,
button.hidden {
  display: none !important;
}

#study-top-actions button:not(.hidden) {
  animation: fadeInPop 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeInPop {
  0% {
    opacity: 0;
    transform: scale(0.94) translateY(3px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.subtle-button {

}

}
.subtle-button:active {

}

.chip-button {

.clean-input, .clean-select {

  outline: none;
  caret-color: var(--rose);

}

}

  background: var(--paper);

}

textarea::placeholder {

}

/* Të gjitha zonat e shkrimit mbeten me madhësi të kontrolluar. */
textarea {

}

.arena-subject-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: clamp(11.5px, 2.2vw, 13px);
  font-weight: 700;
  border: 1px solid var(--card-border);
  max-width: min(220px, 45vw);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.arena-wakelock-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--text-muted);
  font-size: clamp(10.5px, 2vw, 11.5px);
  font-weight: 600;
  white-space: nowrap;
}

.ambient-sound-select {
  height: 36px;
  padding: 0 10px;
  border-radius: var(--radius-full);
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--text-main);
  font-size: clamp(11px, 2vw, 12px);
  font-weight: 600;
  outline: none;
  cursor: pointer;
  max-width: 140px;
}

/* Center Piece with Adaptive Ring */
.arena-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin: auto;
  position: relative;
  width: 100%;
}

.timer-ring-container {
  position: relative;
  /* Perfect responsive sizing tied to both viewport width & height */
  width: min(76vw, min(360px, 38vh));
  height: min(76vw, min(360px, 38vh));
  min-width: 220px;
  min-height: 220px;
  display: grid;
  place-items: center;
  margin: 0 auto;
}

.timer-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.timer-svg-track {
  fill: none;
  stroke: var(--line);
  stroke-width: 6;
}

.timer-svg-progress {
  fill: none;
  stroke: var(--rose);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
  filter: drop-shadow(0 0 14px var(--rose-glow));
}

.timer-ring-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
  gap: clamp(8px, 2vh, 14px);
  padding: clamp(14px, 3vw, 24px);
  text-align: center;
  box-sizing: border-box;
}

.arena-top-tag {
  font-size: clamp(9px, 1.8vw, 11px);
  font-weight: 700;
  letter-spacing: 1.8px;
  color: var(--text-eyebrow);
  text-transform: uppercase;
}

.arena-clock {
  font-family: "Playfair Display", Georgia, serif;
  font-size: min(13vw, min(74px, 8.8vh));
  font-weight: 700;
  color: var(--text-heading);
  line-height: 1;
  letter-spacing: -2px;
  margin: 0;
}

.arena-status-text {
  font-size: clamp(9.5px, 1.8vw, 11px);
  font-weight: 700;
  color: var(--badge-text);
  letter-spacing: 1.3px;
  text-transform: uppercase;
  background: var(--badge-bg);
  padding: 4px clamp(10px, 2.5vw, 14px);
  border-radius: var(--radius-full);
  border: 1px solid var(--card-border);
  display: inline-block;
  white-space: nowrap;
}

/* Arena Bottom Controls — Fluidly Responsive */
.arena-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  flex-shrink: 0;
}

.arena-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 clamp(14px, 3vw, 20px);
  border-radius: var(--radius-full);
  font-size: clamp(12px, 2.2vw, 13.5px);
  font-weight: 700;
  transition: var(--transition-smooth);
  white-space: nowrap;
}

.arena-primary-btn {
  background: linear-gradient(110deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  color: var(--primary-btn-text);
  box-shadow: 0 8px 22px var(--rose-glow);
}
.arena-primary-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}

.arena-subtle-btn {
  background: var(--subtle-btn-bg);
  border: 1px solid var(--subtle-btn-border);
  color: var(--subtle-btn-text);
}
.arena-subtle-btn:hover {
  background: var(--subtle-btn-hover);
  transform: translateY(-2px);
}

.arena-subtle-btn.locked {
  background: #fee2e2;
  border-color: #f87171;
  color: #dc2626;
}

/* Landscape Mode on Mobile */
@media (max-height: 520px) and (orientation: landscape) {
  .focus-fullscreen-arena {
    padding: 10px 20px !important;
  }
  .arena-center {
    padding: 4px 0;
  }
  .timer-ring-container {
    width: min(50vh, 220px);
    height: min(50vh, 220px);
    min-width: 180px;
    min-height: 180px;
  }
  .arena-clock {
    font-size: min(46px, 12vh);
  }
  .arena-controls {
    gap: 8px;
  }
  .arena-btn {
    min-height: 38px;
    padding: 0 12px;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .arena-wakelock-pill span:not(:first-child) {
    display: none;
  }
  .arena-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .arena-controls button {
    width: 100%;
    padding: 0 10px;
    font-size: 12px;
  }
}


/* ==========================================================================
   Modals, Toasts & Overlays
   ========================================================================== */
.confirm-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  transition: opacity 0.25s ease;
}
.confirm-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.confirm-modal {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: clamp(20px, 4vw, 28px);
  width: min(380px, 100%);
  text-align: center;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  animation: modalPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalPopIn {
  0% { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.confirm-modal b {
  font-size: 20px;
  display: block;
  margin-bottom: 8px;
}
.confirm-modal p {
  color: var(--text-lead);
  font-size: 13px;
  margin-bottom: 20px;
}
.confirm-actions {
  display: flex;
  gap: 10px;
}
.confirm-actions button {
  flex: 1;
}

.quick-add-modal {
  width: min(560px, 100%);
  overflow: hidden;
  color: var(--text-main);
  border: 1px solid color-mix(in srgb, var(--card-border) 82%, var(--rose) 18%);
  border-radius: 18px;
  background: var(--card-bg);
  box-shadow: 0 28px 80px rgba(25, 16, 21, 0.32);
  text-align: left;
  animation: quickAddIn .22s cubic-bezier(.2, .8, .2, 1);
}

/* Quick add stays close to the bottom navigation, like a task composer. */

  align-items: flex-end;

}

.confirm-overlay.quick-add-overlay .quick-add-modal {

  align-self: auto;
}

@keyframes quickAddIn {

.quick-add-form {

.quick-add-main {

.quick-add-title {

.quick-add-success {

.quick-task-modal {

.quick-task-title-shell {

.quick-task-template-chip {

.quick-task-conflict {

.quick-task-modal .quick-add-options {

.quick-task-modal .quick-add-field {

.empty-state-box {

  letter-spacing: 0.5px;
  text-align: center;
  margin-top: 2px;
}

.hero-pomo-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
  justify-content: center;
}

.hero-pomo-btn {
  height: 34px;
  padding: 0 12px;
  border-radius: var(--radius-full);
  background: var(--paper);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: var(--transition-smooth);
}
.hero-pomo-btn:hover {
  border-color: var(--rose);
  transform: translateY(-1px);
}
.hero-pomo-btn.primary {
  background: linear-gradient(135deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 4px 12px var(--rose-glow);
}


/* ==========================================================================
   Generous Screen & Header Breathing Space (Airy Layout)
   ========================================================================== */
.screen {
  padding-top: clamp(12px, 2vw, 22px);
  min-height: 480px;
}

.study-screen {
  padding-top: clamp(14px, 2.5vw, 26px);
  position: relative;
}

  
/* ============================================================
   HAPI — Shënime dhe kartela Anki për secilën lëndë
   Panel i pastër, i hapur vetëm kur përdoruesja zgjedh një lëndë.
   ============================================================ */
.subject-tools-button {
  width: 100%;
  min-height: 39px !important;
  padding: 0 11px !important;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 7px;
  color: var(--text-heading);
  border-color: color-mix(in srgb, var(--rose) 25%, var(--line));
  background: color-mix(in srgb, var(--card-bg) 92%, var(--rose) 8%);
  font-size: 10.5px !important;
  font-weight: 700;
  text-align: left;
}

.subject-tools-button:hover {
  color: var(--rose-deep);
  border-color: color-mix(in srgb, var(--rose) 48%, var(--line));
  background: color-mix(in srgb, var(--card-bg) 86%, var(--rose) 14%);
}

.subject-study-workspace {
  margin-top: 18px;
  padding: clamp(18px, 3vw, 26px);
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card-bg);
}

.subject-workspace-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.subject-workspace-title {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.subject-workspace-title > span {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  border-radius: 12px;
  background: var(--subtle-btn-bg);
  font-size: 21px;
}

.subject-workspace-title b,
.subject-workspace-title small {
  display: block;
}

.subject-workspace-title b {
  color: var(--text-heading);
  font-family: "Playfair Display", Georgia, serif;
  font-size: 20px;
}

.subject-workspace-title small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 10.5px;
}

.subject-tools-grid {
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
  gap: 14px;
  align-items: start;
}

.subject-tool-panel {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: color-mix(in srgb, var(--card-bg) 96%, var(--rose) 4%);
}

.subject-tool-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.subject-tool-panel-head b,
.subject-tool-panel-head small {
  display: block;
}

.subject-tool-panel-head b {
  color: var(--text-heading);
  font-size: 14px;
}

.subject-tool-panel-head small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.4;
}

.subject-notes-area {
  width: 100%;
  height: clamp(230px, 32vh, 310px);
  min-height: 230px;
  padding: 16px;
  color: var(--text-main);
  border: 1px solid color-mix(in srgb, var(--line) 80%, var(--rose) 20%);
  border-radius: 15px;
  background: color-mix(in srgb, var(--bg-shell) 96%, var(--rose) 4%);
  font: 13px/1.65 "DM Sans", Arial, sans-serif;
  box-shadow: 0 1px 0 rgba(255,255,255,.65) inset;
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

.subject-notes-area:focus,
.flashcard-form textarea:focus {
  outline: none;
  border-color: var(--rose);
  background: var(--paper);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--rose) 14%, transparent), 0 10px 24px rgba(89, 57, 69, .06);
}

.subject-note-date-row {
  display: flex;
  align-items: end;
  gap: 8px;
  margin-bottom: 9px;
}

.subject-note-date-row label { min-width: 0; flex: 1; }

.subject-note-date-row label span {
  display: block;
  margin-bottom: 4px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.subject-note-date-row input {
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  color: var(--text-heading);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-shell);
  font: 600 11px/1 "DM Sans", Arial, sans-serif;
}

.subject-note-date-row input:focus {
  outline: 3px solid color-mix(in srgb, var(--rose) 16%, transparent);
  border-color: color-mix(in srgb, var(--rose) 42%, var(--line));
}

.subject-note-days {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  padding-bottom: 2px;
  overflow-x: auto;
  scrollbar-width: thin;
}

.subject-note-day {
  flex: 0 0 auto;
  min-height: 30px;
  padding: 5px 9px;
  color: var(--text-muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card-bg);
  font-size: 9px;
  font-weight: 700;
}

.subject-note-day.active {
  color: #fff;
  border-color: var(--rose);
  background: var(--rose);
}

.subject-notes-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}

.subject-notes-footer small {
  color: var(--text-muted);
  font-size: 9.5px;
}

.flashcard-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-bottom: 12px;
}

.flashcard-summary div {
  padding: 9px 7px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg-shell);
}

.flashcard-summary b,
.flashcard-summary small {
  display: block;
}

.flashcard-summary b {
  color: var(--text-heading);
  font-size: 17px;
}

.flashcard-summary small {
  margin-top: 1px;
  color: var(--text-muted);
  font-size: 8.5px;
}

.flashcard-form {
  display: grid;
  gap: 10px;
}

.flashcard-field {
  display: grid;
  gap: 5px;
}

.flashcard-field > span {
  padding-left: 2px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.flashcard-form textarea {
  width: 100%;
  height: 86px;
  min-height: 86px;
  padding: 13px 14px;
  color: var(--text-main);
  border: 1px solid color-mix(in srgb, var(--line) 80%, var(--rose) 20%);
  border-radius: 14px;
  background: color-mix(in srgb, var(--bg-shell) 96%, var(--rose) 4%);
  font: 12.5px/1.55 "DM Sans", Arial, sans-serif;
  box-shadow: 0 1px 0 rgba(255,255,255,.65) inset;
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

.flashcard-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.flashcard-review {
  min-height: 270px;
  padding: 18px;
  display: grid;
  align-content: center;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg-shell);
}

.flashcard-review-progress {
  margin-bottom: 10px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
}

.flashcard-question-label,
.flashcard-answer-label {
  display: block;
  margin-bottom: 7px;
  color: var(--text-eyebrow);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .09em;
}

.flashcard-question {
  margin: 0 auto 15px;
  max-width: 540px;
  color: var(--text-heading);
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(20px, 3vw, 27px);
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.flashcard-answer {
  margin: 0 auto 17px;
  max-width: 540px;
  color: var(--text-main);
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.flashcard-rating-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}

.flashcard-rating-actions button {
  min-height: 42px;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card-bg);
  color: var(--text-main);
  font-size: 10px;
  font-weight: 700;
}

.flashcard-rating-actions button small {
  display: block;
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 8px;
  font-weight: 500;
}

.flashcard-rating-actions button:hover {
  border-color: color-mix(in srgb, var(--rose) 38%, var(--line));
  background: color-mix(in srgb, var(--card-bg) 95%, var(--rose) 5%);
}

.flashcard-list-mini {
  display: grid;
  gap: 6px;
  margin-top: 12px;
}

.flashcard-list-row {
  padding: 9px 10px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-shell);
}

.flashcard-list-row b,
.flashcard-list-row small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.flashcard-list-row b {
  color: var(--text-heading);
  font-size: 10.5px;
}

.flashcard-list-row small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 8.5px;
}

.flashcard-empty {
  padding: 20px 12px;
  color: var(--text-muted);
  border: 1px dashed var(--line);
  border-radius: 12px;
  text-align: center;
  font-size: 10.5px;
  line-height: 1.5;
}

@media (max-width: 1050px) {
  .subjects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 760px) {
  /* Në telefon scroll-i punon normalisht, por shiriti nuk merr hapësirë vizuale. */
  * {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  *::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  .subjects-grid { grid-template-columns: 1fr; }
  .subject-card-lux { min-height: 0; }
  .subject-tools-grid { grid-template-columns: 1fr; }
  .subject-workspace-head { align-items: flex-start; }
  .subject-notes-area { min-height: 190px; }
  .flashcard-rating-actions { grid-template-columns: 1fr; }
}

@media (max-width: 460px) {
  .subject-workspace-head { flex-direction: column; }
  .subject-workspace-head > button { width: 100%; }
  .subject-card-actions { align-items: stretch; flex-direction: column; }
  .subject-card-actions > div { display: grid !important; grid-template-columns: 1fr 1fr; }
  .subject-tools-button { grid-column: 1 / -1; }
  .subject-note-date-row { align-items: stretch; flex-direction: column; }
  .subject-note-date-row > button { width: 100%; }
}

/* Emma's Space — focused personal app refinements */
.wordmark .tulip-icon { font-size: 16px; opacity: .8; }
.wordmark b { letter-spacing: -.02em; }
.glass-nav { gap: 2px; }
.nav-item span:not(.nav-icon) { white-space: nowrap; }

.nav-add-button {
  position: absolute;
  top: -44px;
  right: 14px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
  border-radius: 999px;
  aspect-ratio: 1 / 1;
  box-sizing: border-box;
  color: var(--primary-btn-text);
  background: linear-gradient(135deg, var(--primary-btn-bg1), var(--primary-btn-bg2));
  box-shadow: 0 6px 16px var(--rose-glow);

}
.nav-add-button svg { display: block; width: 16px; height: 16px; }
.nav-add-button:hover { transform: translateY(-1px); filter: brightness(1.04); }
.nav-add-button:active { transform: scale(.92); }
.nav-add-button:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

.today-priorities-card {
  margin: 22px 0;
  padding: 20px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  background: linear-gradient(145deg, var(--card-bg), var(--rose-light));
  box-shadow: 0 14px 34px rgba(136, 80, 107, .07);
}
.today-priorities-head,
.priority-row,
.settings-row,
.photo-picker-row,
.plan-screen-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.today-priorities-head h2 { margin: 0; font-size: 20px; }
.priority-list { display: grid; gap: 9px; margin-top: 14px; }
.priority-row {
  justify-content: flex-start;
  min-height: 44px;
  padding: 9px 12px;
  border-radius: 14px;
  background: var(--paper);
  border: 1px solid var(--line);
}
.priority-row.done b { color: var(--text-muted); text-decoration: line-through; }
.priority-row button { flex: 0 0 auto; }
.priority-row b { flex: 1; font-size: 13px; }
.priority-form { display: flex; gap: 8px; margin-top: 12px; }
.priority-form input { flex: 1; }
.gentle-empty { color: var(--text-muted); font-size: 13px; margin: 0; }

.plan-week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(150px, 1fr));
  gap: 12px;
  overflow-x: auto;
  padding: 4px 2px 16px;
  scroll-snap-type: x proximity;
}
.plan-day-card {
  min-height: 230px;
  padding: 15px;
  border-radius: 18px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  scroll-snap-align: start;
}
.plan-day-card.today-card { border-color: var(--rose); box-shadow: 0 10px 26px var(--rose-glow); }
.plan-day-card h3 { margin: 4px 0 12px; font-size: 16px; }
.plan-item { display: block; padding: 9px 10px; margin: 7px 0; border-radius: 12px; background: var(--rose-light); font-size: 12px; }
.plan-item.exam { background: var(--accent-blue-bg); color: var(--accent-blue); }
.plan-item.done { opacity: .58; text-decoration: line-through; }
.plan-item small { display: block; margin-top: 3px; color: var(--text-muted); }

.journal-photo-picker {
  margin: 12px 0 4px;
  padding: 13px;
  border: 1px dashed var(--subtle-btn-border);
  border-radius: 16px;
  background: var(--subtle-btn-bg);
}
.photo-picker-row { justify-content: flex-start; flex-wrap: wrap; }
.journal-photo-previews,
.journal-photo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.journal-photo-thumb { position: relative; overflow: hidden; aspect-ratio: 1; border-radius: 12px; background: var(--rose-light); }
.journal-photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.journal-photo-thumb button { position: absolute; top: 5px; right: 5px; width: 25px; height: 25px; border: 0; border-radius: 999px; background: rgba(30, 18, 25, .72); color: white; cursor: pointer; }
.journal-page-card.editing { outline: 2px solid var(--rose); }
.journal-edit-note { font-size: 12px; color: var(--rose); font-weight: 700; }

.theme-choice-grid { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 10px; margin-top: 14px; }
.theme-choice {
  min-height: 62px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--subtle-btn-bg);
  color: var(--text-main);
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
}
.theme-choice.selected { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-glow); }
.theme-swatch { display: block; width: 100%; height: 18px; border-radius: 999px; margin-bottom: 7px; }
.pin-settings { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.pin-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pin-form input { width: 170px; letter-spacing: .35em; text-align: center; }
.privacy-note { margin-top: 10px; color: var(--text-muted); font-size: 11.5px; line-height: 1.55; }

.emma-lock-screen,
.emma-loading-screen {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at top, var(--bg-radial-1), var(--bg-page) 62%);
}
.emma-lock-card {
  width: min(100%, 390px);
  padding: 30px;
  text-align: center;
  border-radius: 28px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  box-shadow: var(--shell-shadow);
}
.emma-lock-card img { width: 84px; height: 84px; object-fit: cover; border-radius: 50%; margin-bottom: 10px; }
.emma-lock-card h1 { font-size: 30px; margin: 5px 0; }
.emma-lock-card p { color: var(--text-muted); font-size: 13px; }
.emma-lock-card form { display: grid; gap: 10px; margin-top: 18px; }
.emma-lock-card input { text-align: center; letter-spacing: .45em; font-size: 20px; }
.lock-error { min-height: 18px; color: var(--rose); font-size: 12px; }

/* Opening splash: native elements keep the approved design crisp and offline. */
.emma-opening-screen {
  --opening-bg: #fffcfd;
  --opening-ink: #35252f;
  --opening-muted: #76636d;
  --opening-accent: #ae4a72;
  --opening-track: #f2e3e9;
  --opening-tile: #fbe6eb;
  --opening-glow: rgba(239, 184, 205, .27);
  box-sizing: border-box;
  height: 100vh;
  height: 100svh;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  grid-template-rows: minmax(16px, .75fr) auto minmax(90px, 1.25fr);
  justify-items: center;
  padding: max(32px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  background: radial-gradient(ellipse at 50% 115%, var(--opening-glow), transparent 56%), var(--opening-bg);
  color: var(--opening-ink);
  text-align: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body:not([data-theme="light-blush"]) .emma-opening-screen {
  --opening-bg: var(--bg-page);
  --opening-ink: var(--text-heading);
  --opening-muted: var(--text-lead);
  --opening-accent: #e0a4bd;
  --opening-track: color-mix(in srgb, var(--paper) 88%, #e0a4bd);
  --opening-tile: color-mix(in srgb, var(--paper) 86%, #e0a4bd);
  --opening-glow: rgba(174, 74, 114, .13);
}
.emma-opening-content { grid-row: 2; width: min(100%, 440px); min-width: 0; }
.emma-opening-emblem { position: relative; display: grid; place-items: center; width: 160px; height: 160px; margin: 0 auto 20px; }
.emma-opening-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: emma-opening-turn 3.6s linear infinite; }
.emma-opening-ring-track { stroke: var(--opening-track); }
.emma-opening-ring-arc { stroke: var(--opening-accent); }
.emma-opening-monogram { position: relative; display: grid; place-items: center; width: 88px; height: 88px; border-radius: 27px; background: linear-gradient(145deg, var(--opening-tile), var(--opening-bg)); color: var(--opening-accent); box-shadow: 0 13px 28px rgba(119, 55, 83, .12); font: 68px/1 Georgia, "Times New Roman", serif; }
.emma-opening-monogram > span { transform: translateY(-1px); }
.emma-opening-spark { position: absolute; top: 14px; right: 12px; width: 15px; height: 15px; fill: currentColor; }
.emma-opening-content h1 { margin: 0; color: var(--opening-ink); font: 650 clamp(27px, 7.8vw, 34px)/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.9px; }
.emma-opening-subtitle { margin: 10px 0 0; color: var(--opening-muted); font-size: 18px; line-height: 1.5; }
.emma-opening-status { width: min(224px, 100%); margin: 76px auto 0; }
.emma-opening-bar { height: 5px; border-radius: 99px; overflow: hidden; background: var(--opening-track); }

  function schoolLessonError(lesson) {
    if (!SCHOOL_DAYS.some(item => item.day === lesson.day)) return "Zgjidh ditën e mësimit.";
    if (!lesson.subject || lesson.subject.length > 120) return "Shkruaj emrin e lëndës (deri në 120 shkronja).";
    const timePattern = /^([01]\d|2[0-3]):[0-5]\d$/;
    if (!timePattern.test(lesson.startTime) || !timePattern.test(lesson.endTime)) return "Vendos orën e fillimit dhe të mbarimit.";
    if (lesson.endTime <= lesson.startTime) return "Ora e mbarimit duhet të jetë pas fillimit.";
    if (lesson.room.length > 80) return "Shkruaj një klasë ose sallë më të shkurtër.";
    return "";
  }

  function normalizeSchoolSchedule(saved) {
    // Only older data with no timetable gets the example. An empty timetable stays empty.
    if (saved === undefined) return exampleSchoolSchedule();
    const usedIds = new Set();
    const lessons = (Array.isArray(saved?.lessons) ? saved.lessons : []).flatMap(item => {
      if (!item || typeof item !== "object") return [];
      const lesson = {
        id: typeof item.id === "string" && item.id ? item.id : id("lesson"),
        day: Number(item.day),
        subject: typeof item.subject === "string" ? item.subject.trim() : "",
        startTime: typeof item.startTime === "string" ? item.startTime : "",
        endTime: typeof item.endTime === "string" ? item.endTime : "",
        room: typeof item.room === "string" ? item.room.trim() : "",
        isExample: item.isExample === true
      };
      if (schoolLessonError(lesson)) return [];
      if (usedIds.has(lesson.id)) lesson.id = id("lesson");
      usedIds.add(lesson.id);
      return [lesson];
    });
    return { isExample: lessons.some(lesson => lesson.isExample), lessons, pdf: normalizeSchoolPdf(saved?.pdf) };
  }

  function normalizeSchoolPdf(pdf) {
    if (!pdf || typeof pdf.name !== "string" || typeof pdf.data !== "string") return null;
    if (!/^data:application\/pdf;base64,JVBERi0[A-Za-z0-9+/]*={0,2}$/.test(pdf.data) || pdf.data.length > 5592440) return null;
    return { name: pdf.name.slice(0, 180) || "Orari.pdf", type: "application/pdf", data: pdf.data };
  }

  function normalizeSubjectNotes(savedNotes) {
    if (!savedNotes || typeof savedNotes !== "object") return {};
    const normalized = {};

    Object.entries(savedNotes).forEach(([subjectId, subjectValue]) => {
      if (!subjectValue || typeof subjectValue !== "object") return;

      // Shënimet e versionit të mëparshëm ruhen në datën e përditësimit të tyre.
      if (typeof subjectValue.content === "string") {
        const legacyTime = subjectValue.updatedAt ? new Date(subjectValue.updatedAt) : new Date();
        const legacyDate = Number.isNaN(legacyTime.getTime()) ? studyDayKey() : studyDayKey(legacyTime);
        normalized[subjectId] = {
          [legacyDate]: {
            content: subjectValue.content,
            updatedAt: subjectValue.updatedAt || new Date().toISOString()
          }
        };
        return;
      }

      const datedNotes = {};
      Object.entries(subjectValue).forEach(([dateKey, record]) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey) || !record || typeof record.content !== "string") return;
        datedNotes[dateKey] = { content: record.content, updatedAt: record.updatedAt || "" };
      });
      normalized[subjectId] = datedNotes;
    });

    return normalized;
  }

  let dbPromise = null;
  let storageReady = false;

  function openEmmaDB() {
    if (!window.indexedDB) return Promise.reject(new Error("IndexedDB unavailable"));
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "key" });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("Nuk u hap ruajtja lokale."));
    });
    return dbPromise;
  }

  async function readStoredState() {
    const db = await openEmmaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const request = tx.objectStore(STORE_NAME).get("state");
      request.onsuccess = () => resolve(request.result?.value || null);
      request.onerror = () => reject(request.error);
    });
  }

  async function persistStoredState(value) {
    const db = await openEmmaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({ key: "state", value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error("Ruajtja lokale u ndërpre."));
    });
  }

  async function clearStoredState() {
    const db = await openEmmaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete("state");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadPersistentState() {
    const stored = await readStoredState();
    if (stored) return normalizeState(stored);
    const migrated = loadLegacyState();
    await persistStoredState(migrated);
    return migrated;
  }

  function parseBackupPayload(parsed) {
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Format i pavlefshëm");
    if (parsed.format === BACKUP_FORMAT) {
      if (!Number.isInteger(parsed.version) || parsed.version < 1 || parsed.version>SCHEMA_VERSION || !parsed.data || typeof parsed.data !== "object") throw new Error("Backup i paplotë ose version më i ri");
      if(!['journalPages','studyTasks','subjects'].some(key=>Array.isArray(parsed.data[key])))throw new Error('Kopja nuk përmban të dhëna të aplikacionit');
      for(const key of ['journalPages','studyTasks','subjects','exams','customRoutines'])if(parsed.data[key]!==undefined&&!Array.isArray(parsed.data[key]))throw new Error('Të dhëna të dëmtuara');
      if (parsed.data.schoolSchedule?.pdf && !normalizeSchoolPdf(parsed.data.schoolSchedule.pdf)) throw new Error("PDF i pavlefshëm në kopjen rezervë");
      return normalizeState(parsed.data);
    }
    const looksLegacy = Array.isArray(parsed.studyTasks) || Array.isArray(parsed.journalPages) || Array.isArray(parsed.subjects);
    if (!looksLegacy) throw new Error("Nuk është backup i Emma’s Space");
    return normalizeState(parsed);
  }

  let state = blankState();

  function save({ requireDatabase = false } = {}) {
    const snapshot = JSON.parse(JSON.stringify({ ...state, schemaVersion: SCHEMA_VERSION }));
    if (!storageReady) {
      if (requireDatabase) return Promise.reject(new Error("Ruajtja lokale nuk është e disponueshme për PDF-në. Mund t'i caktosh orët manualisht."));
      localStorage.setItem(FALLBACK_KEY, JSON.stringify(snapshot));
      return Promise.resolve();
    }
    saveQueue = saveQueue.catch(() => {}).then(() => persistStoredState(snapshot)).catch(error => {
      if (requireDatabase) throw error;
      localStorage.setItem(FALLBACK_KEY, JSON.stringify(snapshot));
    });
    return saveQueue;
  }

  function bytesToHex(bytes) {
    return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
  }

  async function hashPin(pin, salt) {
    const payload = new TextEncoder().encode(`${salt}:${pin}`);
    const digest = await crypto.subtle.digest("SHA-256", payload);
    return bytesToHex(new Uint8Array(digest));
  }

  function createPinSalt() {
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return bytesToHex(bytes);
  }

  async function tryUnlock(pin) {
    if(!hasWorkspaceAccess())return {ok:false,message:'Kyçu fillimisht me email dhe fjalëkalim.'};
    const now = Date.now();
    if (now < unlockBlockedUntil) return { ok: false, message: `Prit ${Math.ceil((unlockBlockedUntil - now) / 1000)} sekonda dhe provo përsëri.` };
    const candidate = await hashPin(pin, state.pin.salt);
    if (candidate === state.pin.hash) {
      appLocked = false;
      unlockAttempts = 0;
      render();
      activatePrivateSession();
      return { ok: true };
    }
    unlockAttempts += 1;
    if (unlockAttempts >= 5) {
      unlockAttempts = 0;
      unlockBlockedUntil = Date.now() + 30000;
      return { ok: false, message: "Shumë tentativa. Provo përsëri pas 30 sekondash." };
    }
    return { ok: false, message: "PIN-i nuk është i saktë." };
  }

  /* ==========================================================================
     Audio Synthesizer (Zero External Assets - Web Audio API)
     ========================================================================== */
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playSound(type) {
    if (!state.soundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      
      const now = ctx.currentTime;
      if (type === "complete") {
        // Uplifting Bell Chime (C5 -> E5 -> G5)
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.65);
        });
      } else if (type === "focus_done") {
        // Singing Bowl Warm Gong
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(432, now); // 432 Hz healing tone
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 2.6);
      } else if (type === "click") {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    } catch {}
  }

  /* ==========================================================================
     Helper Utilities
     ========================================================================== */
  function id(prefix = "item") {
    return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
  }

  function escapeHTML(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  function today(offset = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
  }

  function daysUntil(dateText) {
    if (!dateText) return 999;
    const due = new Date(`${dateText}T12:00:00`);
    const now = new Date();
    now.setHours(12, 0, 0, 0);
    return Math.round((due - now) / 86400000);
  }

  function dueBadgeHTML(dateText) {
    const days = daysUntil(dateText);
    if (days < 0) return `<span class="badge-tag urgent">⚠️ ${Math.abs(days)} ditë me vonesë</span>`;
    if (days === 0) return `<span class="badge-tag urgent">🔴 Sot</span>`;
    if (days === 1) return `<span class="badge-tag soon">🟠 Nesër</span>`;
    if (days <= 3) return `<span class="badge-tag soon">🟡 Pas ${days} ditësh</span>`;
    return `<span class="badge-tag">📅 ${dateText}</span>`;
  }

  function prettyAlbanianDate(isoString) {
    const date = isoString ? new Date(isoString) : new Date();
    const days = ["E Diel", "E Hënë", "E Martë", "E Mërkurë", "E Enjte", "E Premte", "E Shtunë"];
    const months = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
    return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]}`;
  }

  function formatExamDate(isoString) {
    if (!isoString) return "Pa datë";
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return isoString;
    const months = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
    const days = ["E Diel", "E Hënë", "E Martë", "E Mërkurë", "E Enjte", "E Premte", "E Shtunë"];
    return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
  }

  function formatExamTime(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return "";
    const h = String(date.getHours()).padStart(2, "0");
    const m = String(date.getMinutes()).padStart(2, "0");
    return `${h}:${m}`;
  }

  function getExamCountdown(isoString) {
    if (!isoString) return { text: "Pa orar", status: "normal", hoursLeft: 9999 };
    const target = new Date(isoString);
    if (isNaN(target.getTime())) return { text: "Datë e pavlefshme", status: "normal", hoursLeft: 9999 };
    
    const now = new Date();
    const diffMs = target.getTime() - now.getTime();

    if (diffMs <= 0) {
      const diffHoursAgo = Math.abs(diffMs) / (1000 * 60 * 60);
      if (diffHoursAgo < 6) {
        return { text: "🔥 Po mbahet / Sot!", status: "urgent", hoursLeft: 0 };
      }
      return { text: "✅ Përfundoi", status: "done", hoursLeft: -1 };
    }

    const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
    const days = Math.floor(totalHours / 24);
    const hours = totalHours % 24;
    const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

    let status = "normal";
    if (totalHours < 24) status = "urgent";
    else if (totalHours < 72) status = "soon";

    if (days === 0) {
      if (hours === 0) {
        return { text: `⚠️ Edhe ${mins} min!`, status, hoursLeft: totalHours };
      }
      return { text: `⚠️ Edhe ${hours} orë e ${mins} min`, status, hoursLeft: totalHours };
    }
    if (days === 1) {
      return { text: `⏳ Nesër (${hours} orë mbetur)`, status, hoursLeft: totalHours };
    }
    return { text: `⏳ Edhe ${days} ditë e ${hours} orë`, status, hoursLeft: totalHours };
  }

  /* ==========================================================================

  let wakeLockSentinel = null;
  async function requestScreenWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        const badge = document.getElementById("arena-wakelock-badge");
        if (badge) badge.innerHTML = "<span>☀️</span> Ekrani aktiv (Wake Lock)";
      } catch (err) {
        console.log("WakeLock error:", err);
      }
    }
  }

  function releaseScreenWakeLock() {
    if (wakeLockSentinel) {
      try { wakeLockSentinel.release(); } catch {}
      wakeLockSentinel = null;
    }
  }

  let ambientSource = null;
  let ambientGain = null;
  let currentAmbient = "none";

  function startAmbientSound(type) {
    stopAmbientSound();
    currentAmbient = type;
    if (type === "none") return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;

      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        if (type === "rain") {
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        } else if (type === "waves") {
          data[i] = (lastOut + (0.01 * white)) / 1.01;
          lastOut = data[i];
          data[i] *= 4.0;
        }
      }

      ambientSource = ctx.createBufferSource();
      ambientSource.buffer = buffer;
      ambientSource.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = type === "rain" ? "lowpass" : "bandpass";
      filter.frequency.setValueAtTime(type === "rain" ? 1100 : 350, ctx.currentTime);

      ambientGain = ctx.createGain();
      ambientGain.gain.setValueAtTime(0.09, ctx.currentTime);

      ambientSource.connect(filter);
      filter.connect(ambientGain);
      ambientGain.connect(ctx.destination);
      ambientSource.start();
    } catch {}
  }

  function stopAmbientSound() {
    if (ambientSource) {
      try { ambientSource.stop(); } catch {}
      ambientSource = null;
    }
  }

  function triggerBloomBurst(message) {
    if (message) {

    playSound("complete");

    const overlay = document.createElement("div");
    overlay.className = "bloom-burst-overlay";
    document.body.appendChild(overlay);

    const icons = ["🌸", "🌷", "✨", "💖", "🌿", "✦", "👑", "🌺"];
    const count = 36;
    const startX = window.innerWidth / 2;
    const startY = window.innerHeight / 2;

    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "bloom-particle";
      p.textContent = icons[Math.floor(Math.random() * icons.length)];
      p.style.left = `${startX}px`;
      p.style.top = `${startY}px`;
      p.style.fontSize = `${16 + Math.random() * 20}px`;

      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
      const dist = 120 + Math.random() * 280;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 50;
      const rot = `${Math.floor(Math.random() * 720 - 360)}deg`;

      p.style.setProperty("--dx", `${dx}px`);
      p.style.setProperty("--dy", `${dy}px`);
      p.style.setProperty("--rot", rot);

      overlay.appendChild(p);
    }

    setTimeout(() => {
      overlay.remove();
    }, 2500);
  }

  function launchFocusSession(mins, ambientType, subjectId, displayMode = "fullscreen") {
    focus.minutes = mins || 25;
    focus.seconds = focus.minutes * 60;
    focus.subjectId = subjectId || "";

    if (ambientType && ambientType !== "none") {
      startAmbientSound(ambientType);
    } else {
      stopAmbientSound();
    }

    // Start timer
    clearInterval(focus.timer);
    focus.active = true;
    persistFocusSession();
    focus.timer = setInterval(() => {
      focus.seconds -= 1;
      updateTimerDOM();
      if (focus.seconds <= 0) {
        finishFocusSession();
      }
    }, 1000);

    // Close modal
    const overlay = document.getElementById("confirm-overlay");
    if (overlay) {
      overlay.classList.add("hidden");
      overlay.innerHTML = "";
    }

    updateTimerDOM();
    playSound("click");

    if (displayMode === "fullscreen") {
      openFocusFullscreen();
      updateArenaDOM();
      bloomToast(`Fokusi nisi në Ekran të Plotë (${focus.minutes}m) ⏱️`);
    } else {
      closeFocusFullscreen();
      bloomToast(`Fokusi nisi në sfond (${focus.minutes}m) 📱. Mund të lundrosh lirisht!`);

  /* ==========================================================================
     Focus Timer Logic
     ========================================================================== */
  let focus = {
    active: false,
    minutes: 25,
    seconds: 1500,
    subjectId: "",
    timer: null,
    saved: false
  };

  function persistFocusSession() {
    state.focusSession = {
      active: !!focus.active,
      minutes: focus.minutes,
      seconds: Math.max(0, focus.seconds),
      subjectId: focus.subjectId || "",
      endAt: focus.active ? Date.now() + Math.max(0, focus.seconds) * 1000 : 0
    };
    save();
  }

  function clearFocusSession() {
    state.focusSession = null;
    save();
  }

  function hydrateFocusSession() {
    const saved = state.focusSession;
    if (!saved) return;
    focus.minutes = saved.minutes || 25;
    focus.subjectId = saved.subjectId || "";
    focus.seconds = saved.active && saved.endAt ? Math.max(0, Math.ceil((saved.endAt - Date.now()) / 1000)) : Math.max(0, saved.seconds || 0);
    focus.active = !sessionExited && !!saved.active && focus.seconds > 0;
    focus.saved = false;
    if (focus.active) {
      focus.timer = setInterval(() => {
        focus.seconds = Math.max(0, focus.seconds - 1);
        updateTimerDOM();
        if (focus.seconds <= 0) finishFocusSession();
      }, 1000);
    } else if (focus.seconds <= 0) {
      focus.seconds = focus.minutes * 60;
      clearFocusSession();
    }
  }

  function formatTimer(totalSecs) {
    const m = Math.floor(totalSecs / 60);
    const s = totalSecs % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function updateTimerDOM() {
    const clockEl = document.getElementById("focus-clock");
    if (clockEl) clockEl.textContent = formatTimer(focus.seconds);

    // Update Floating Mini-Timer Pill
    const pill = document.getElementById("floating-focus-pill");
    const miniClock = document.getElementById("mini-timer-clock");
    const miniToggle = document.getElementById("mini-toggle-focus");
    const arena = document.getElementById("fullscreen-focus-arena");
    const isArenaOpen = arena && !arena.classList.contains("hidden");

    if (pill) {
      if (focus.active && !isArenaOpen) {
        pill.classList.remove("hidden");
      } else {
        pill.classList.add("hidden");
      }
    }
    if (miniClock) miniClock.textContent = formatTimer(focus.seconds);
    if (miniToggle) miniToggle.textContent = focus.active ? "⏸" : "▶";

    // Update Hero Live Pomodoro Clock in Home Screen
    const heroClock = document.getElementById("hero-live-pomo-clock");
    if (heroClock) heroClock.textContent = formatTimer(focus.seconds);
    const heroToggle = document.getElementById("hero-pomo-toggle");
    if (heroToggle) heroToggle.textContent = focus.active ? "⏸️ Ndalo" : "▶️ Fillo";

    // Dynamic Swap of Hero Card in Home Screen if route is home
    if (route() === "home") {
      const heroAside = document.getElementById("home-hero-aside");
      if (heroAside) {
        const isCurrentlyPomo = heroAside.classList.contains("hero-active-pomodoro");
        if (focus.active && !isCurrentlyPomo) {
          heroAside.outerHTML = renderHeroRightCard();
        } else if (!focus.active && isCurrentlyPomo) {
          heroAside.outerHTML = renderHeroRightCard();
        }
      }
    }

    const toggleBtn = document.getElementById("focus-toggle");
    if (toggleBtn) {
      if (focus.active) {
        toggleBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" class="inline-svg"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> <span>Ndalo</span>`;
        toggleBtn.className = "subtle-button";
      } else {
        toggleBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" class="inline-svg"><polygon points="5 3 19 12 5 21 5 3"/></svg> <span>Nis Fokusin</span>`;
        toggleBtn.className = "primary-button";
      }
    }
    updateArenaDOM();
  }

  function finishFocusSession() {
    clearInterval(focus.timer);
    focus.active = false;
    const studied = Math.max(1, Math.round((focus.minutes * 60 - focus.seconds) / 60));
    state.focusRecords.push({
      date: today(),
      minutes: studied,
      subjectId: focus.subjectId || undefined
    });
    state.focusSession = null;
    save();
    focus.seconds = focus.minutes * 60;
    updateTimerDOM();
    playSound("focus_done");
    triggerBloomBurst(`Mrekulli, Emma! Përfundove ${studied} minuta fokus të thellë. ✦`);
    updateHomeHubStats();
    updateRoutineProgressDOM();
  }

  function studyDayKey(date = new Date()) {
    const value = new Date(date);
    return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, "0")}-${String(value.getDate()).padStart(2, "0")}`;
  }

  function studyAddDays(days) {
    const date = new Date();
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() + Math.max(0, Number(days) || 0));
    return studyDayKey(date);
  }

  function subjectNoteDateLabel(dateKey, includeYear = false) {
    const date = new Date(`${dateKey}T12:00:00`);
    if (Number.isNaN(date.getTime())) return dateKey;
    const weekdays = ["E diel", "E hënë", "E martë", "E mërkurë", "E enjte", "E premte", "E shtunë"];
    const months = ["janar", "shkurt", "mars", "prill", "maj", "qershor", "korrik", "gusht", "shtator", "tetor", "nëntor", "dhjetor"];
    if (includeYear) return `${weekdays[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    return `${date.getDate()} ${months[date.getMonth()].slice(0, 3)}`;
  }

  function subjectCards(subjectId) {
    return (state.flashcards || [])
      .filter(card => card.subjectId === subjectId)
      .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
  }

  function subjectDueCards(subjectId) {
    const todayKey = studyDayKey();
    return subjectCards(subjectId).filter(card => !card.dueDate || card.dueDate <= todayKey);
  }

  function flashcardDueLabel(card) {
    if (!card.dueDate || card.dueDate <= studyDayKey()) return "Për sot";
    const date = new Date(`${card.dueDate}T12:00:00`);
    return `Më ${new Intl.DateTimeFormat("sq-AL", { day: "numeric", month: "short" }).format(date)}`;
  }

  async function renderSchoolPdfPage() {
    const session = schoolPdfSession;
    const canvas = document.getElementById("school-pdf-canvas");
    if (!session?.document || !canvas || session.rendering) return;
    session.rendering = true;
    const prev = document.getElementById("school-pdf-prev");
    const next = document.getElementById("school-pdf-next");
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
    document.getElementById("school-pdf-page-label").textContent = `${session.page} / ${session.document.numPages}`;
    try {
      const page = await session.document.getPage(session.page);
      if (schoolPdfSession !== session) return;
      const viewport = page.getViewport({ scale: 1 });
      const width = Math.min(1800, Math.max(240, canvas.parentElement.clientWidth - 16) * Math.min(window.devicePixelRatio || 1, 2) * session.zoom);
      const scaled = page.getViewport({ scale: Math.min(width / viewport.width, 2800 / viewport.height) });
      canvas.style.width = `${session.zoom * 100}%`;
      canvas.width = Math.ceil(scaled.width);
      canvas.height = Math.ceil(scaled.height);
      session.renderTask = page.render({ canvasContext: canvas.getContext("2d"), viewport: scaled });
      await session.renderTask.promise;
    } catch (error) {
      if (schoolPdfSession === session && error?.name !== "RenderingCancelledException") document.getElementById("school-pdf-preview-error").textContent = 'Pamja nuk u hap plotësisht. Përdor “Shkarko PDF” për ta parë dokumentin.';
    } finally {
      session.rendering = false;
      if (schoolPdfSession === session) {
        if (prev) prev.disabled = session.page <= 1;
        if (next) next.disabled = session.page >= session.document.numPages;
      }
    }
  }

  async function loadSchoolPdf(file = null) {
    const storedPdf = state.schoolSchedule.pdf;
    if (!file && !storedPdf) return;
    showCustomModal(`<div class="quick-add-modal school-pdf-modal" role="dialog" aria-modal="true" aria-labelledby="school-pdf-loading-heading"><div class="quick-add-main"><h2 id="school-pdf-loading-heading">Po hap PDF-në…</h2><p id="school-pdf-loading" role="status">Vetëm në pajisjen tënde. Orari ekzistues nuk ndryshohet.</p></div><div class="quick-add-footer"><button type="button" class="subtle-button" id="btn-close-modal">Anulo</button></div></div>`);
    const pending = { token: schoolPdfToken, loading: true };
    schoolPdfSession = pending;
    try {
      if (!window.EmmaSchedulePdf) throw new Error("Lexuesi i PDF-së mungon. Rifresko aplikacionin.");
      if (file && !storageReady) throw new Error("Ruajtja lokale për PDF nuk është e disponueshme. Mund t'i caktosh orët manualisht.");
      const candidate = file ? await window.EmmaSchedulePdf.read(file) : { pdf: storedPdf, lessons: [], document: await window.EmmaSchedulePdf.open(window.EmmaSchedulePdf.bytesFromData(storedPdf.data)) };
      if (schoolPdfSession !== pending || !hasWorkspaceAccess() || appLocked) { await candidate.document.destroy(); return; }
      showSchoolPdfModal(candidate, Boolean(file));
    } catch (error) {
      if (schoolPdfSession !== pending) return;
      const message = document.getElementById("school-pdf-loading");
      if (message) message.textContent = error.message || "PDF-ja nuk u hap. Orari aktual nuk u prek.";
    }
  }

  function mergeSchoolLessons(existing, imported) {
    const lessons = existing.filter(lesson => !lesson.isExample).map(lesson => ({ ...lesson }));
    for (const lesson of imported) {
      if (!lessons.some(item => item.day === lesson.day && item.startTime === lesson.startTime && item.endTime === lesson.endTime && item.subject.toLowerCase() === lesson.subject.toLowerCase())) lessons.push(lesson);
    }
    return lessons;
  }

  async function saveSchoolPdf(withLessons) {
    const session = schoolPdfSession;
    if (!session?.importing || session.saving) return;
    const errorBox = document.getElementById("school-pdf-save-error");
    const fail = message => { if (errorBox) { errorBox.textContent = message; errorBox.classList.add("show"); } };
    let lessons = state.schoolSchedule.lessons;
    if (withLessons) {
      const rows = [...document.querySelectorAll("[data-school-import-row]")];
      if (!rows.length) return fail("Nuk ka orë për të ruajtur. Mund të ruash vetëm PDF-në.");
      const imported = rows.map(row => {
        const value = field => row.querySelector(`[data-import-field="${field}"]`)?.value.trim() || "";
        return { id: id("lesson"), day: Number(value("day")), subject: value("subject"), startTime: value("startTime"), endTime: value("endTime"), room: value("room"), isExample: false };
      });
      for (let i = 0; i < imported.length; i++) {
        const error = schoolLessonError(imported[i]);
        if (error) { rows[i].scrollIntoView({ block: "center", behavior: "smooth" }); return fail(`Ora ${i + 1}: ${error}`); }
      }
      const replace = document.getElementById("school-import-mode")?.value === "replace";
      if (replace && state.schoolSchedule.lessons.some(lesson => !lesson.isExample) && !document.getElementById("school-import-replace-confirm")?.checked) return fail("Për ta zëvendësuar orarin, shëno që e lejon zëvendësimin e orëve të tua.");
      lessons = mergeSchoolLessons(replace ? [] : state.schoolSchedule.lessons, imported);
    }
    session.saving = true;
    document.querySelectorAll("#btn-school-save-pdf, #btn-school-save-pdf-lessons").forEach(button => button.disabled = true);
    try {
      await commitSchoolSchedule({ ...state.schoolSchedule, lessons, pdf: session.pdf }, true);
      if (withLessons && lessons.length) activeScheduleDay = lessons[0].day;
      if (schoolPdfSession === session) { closeCustomModal(); render(); }
      else updateHomeSchoolLesson();
      bloomToast("✓ U vendos!");
    } catch {
      session.saving = false;
      document.querySelectorAll("#btn-school-save-pdf, #btn-school-save-pdf-lessons").forEach(button => button.disabled = false);
      fail("PDF-ja nuk u ruajt. Mund të mungojë hapësira në pajisje. Orari ekzistues nuk u ndryshua.");
    }
  }

  function compressJournalPhoto(file) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith("image/")) return reject(new Error("Skedari nuk është fotografi."));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Fotografia nuk u lexua."));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error("Fotografia nuk u hap."));
        image.onload = () => {
          const maxSide = 1400;
          const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const ctx = canvas.getContext("2d", { alpha: false });
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          let data = canvas.toDataURL("image/webp", .82);
          let type = "image/webp";
          if (!data.startsWith("data:image/webp")) {
            data = canvas.toDataURL("image/jpeg", .84);
            type = "image/jpeg";
          }
          resolve({ id: id("photo"), name: file.name || "fotografi", type, data });
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function saveJournalEntry() {
    const titleInput = document.getElementById("journal-title");
    const bodyInput = document.getElementById("journal-body");
    if (!titleInput || !bodyInput) return;

    const title = titleInput.value.trim() || "Një kujtim i bukur";
    const content = journalEditor?.read() || ensureJournalDraft().content;
    const body = EmmaJournalEditor.text(content);

    if (!body && !pendingJournalPhotos.length) {
      bloomToast("Shkruaj diçka para se ta ruash faqen ♡");
      bodyInput.focus();
      return;
    }

    const now = new Date().toISOString();
    const existing = editingJournalId ? state.journalPages.find(page => page.id === editingJournalId) : null;
    if (existing) {
      Object.assign(existing, { title, body, content, mood: currentMood || existing.mood, photos: JSON.parse(JSON.stringify(pendingJournalPhotos)), updatedAt: now });
    } else {
      state.journalPages.unshift({
        id: id("page"),
        date: now,
        updatedAt: now,
        title,
        body,
        content,
        mood: currentMood || "😌 E qetë",
        style: "clean",
        photos: pendingJournalPhotos
      });
    }

    clearJournalDraft();
    await save();
    currentMood = "😌 E qetë";
    playSound("complete");
    bloomToast(existing ? "Ndryshimet u ruajtën ♡" : "Faqja jote u ruajt në ditar! ♡", "📖");
    render();
  }

  async function exportJournalPdf() {
    const button=document.getElementById('btn-export-pdf');
    if(button?.disabled)return;
    if(button){button.disabled=true;button.textContent='Duke krijuar librin…';}
    try {
      const pages=[...state.journalPages].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const bytes=await EmmaJournalPdf.create(pages,{normalize:EmmaJournalEditor.normalize});
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      const anchor=document.createElement('a');anchor.href=url;anchor.download=`emma-space-ditari-${today()}.pdf`;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
      bloomToast('PDF-ja e ditarit u shkarkua.');
    } catch(error){bloomToast(error.message || 'PDF-ja nuk u krijua. Provo përsëri.','⚠️');}
    finally{if(button){button.disabled=false;button.textContent='Krijo PDF-në e ditarit';}}
  }

  function routineConfig(key,label,period='morning') {

  }
  function routineDue(key) {return (state.routineSettings[key]?.days || [1,2,3,4,5,6,0]).includes(new Date().getDay());}
  function editRoutine(key) {
    const index=Number(key.slice(2));
    const original=key.startsWith('d:')?defaultRoutines[index]:state.customRoutines.find(r=>'c:'+r.id===key);
    if(!original)return;
    const config=routineConfig(key,original.label,key.startsWith('d:')?(index<3?'morning':index<5?'afternoon':'evening'):'morning');
    showCustomModal(`<section class="quick-add-modal" role="dialog" aria-modal="true" aria-label="Ndrysho zakonin"><form id="routine-settings-form" data-routine-key="${escapeHTML(key)}"><div class="quick-add-main"><h2>Ndrysho zakonin</h2><label>Emri<input class="clean-input" name="label" maxlength="180" value="${escapeHTML(config.label)}" required></label><label>Pjesa e ditës<select class="clean-select" name="period">${[['morning','Mëngjesi'],['afternoon','Pasditja'],['evening','Mbrëmja']].map(([value,label])=>`<option value="${value}" ${value===config.period?'selected':''}>${label}</option>`).join('')}</select></label><fieldset class="routine-day-options"><legend>Ditët</legend>${[[1,'Hën'],[2,'Mar'],[3,'Mër'],[4,'Enj'],[5,'Pre'],[6,'Sht'],[0,'Die']].map(([value,label])=>`<label><input type="checkbox" name="day" value="${value}" ${config.days.includes(value)?'checked':''}>${label}</label>`).join('')}</fieldset><p id="routine-settings-error" role="alert"></p></div><div class="quick-add-footer"><button type="button" class="subtle-button btn-close-modal">Anulo</button><button class="primary-button" type="submit">Ruaj</button></div></form></section>`);
  }
  function routinePeriod(date = new Date()) {
    const hour = date.getHours();
    return hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening";
  }
  function routineProgress() {
    const visible = defaultRoutines.map((_, index) => index).filter(index => !state.removedDefaultRoutines.includes(index)&&routineDue('d:'+index));
    const custom=state.customRoutines.filter(r=>routineDue('c:'+r.id));
    const done = visible.filter(index => state.completed.includes(index)).length
      + custom.filter(routine => state.customRoutineDone.includes(routine.id)).length;
    return Math.round(done / (visible.length + custom.length || 1) * 100);
  }
  function syncRoutinePeriod(force = false, date = new Date()) {
    if(EmmaSpaceModel.rollover(state,today())) {save();if(document.querySelector('.routine-screen')){render();return;}}
    const screen = document.querySelector(".routine-screen");
    if (!screen) return;
    const period = routinePeriod(date);
    if (!force && period === displayedRoutinePeriod) return;
    displayedRoutinePeriod = period;
    const groups = [...screen.querySelectorAll("[data-routine-period]")];
    groups.forEach(group => { group.open = group.dataset.routinePeriod === period; });
    const current = groups.find(group => group.dataset.routinePeriod === period);
    if (current) screen.querySelector(".hub-card").after(current);
  }

  function generateWeeklyChartHTML() {
    const daysAlb = ["Die", "Hën", "Mar", "Mër", "Enj", "Pre", "Sht"];
    const past7Days = [];
    
    for (let i = 6; i >= 0; i--) {
      const dateStr = today(-i);
      const dObj = new Date();
      dObj.setDate(dObj.getDate() - i);
      const dayName = daysAlb[dObj.getDay()];
      const dayMins = state.focusRecords.filter(r => r.date === dateStr).reduce((a, b) => a + (b.minutes || 0), 0);
      past7Days.push({ date: dateStr, day: dayName, mins: dayMins, isToday: i === 0 });
    }

    const maxMins = Math.max(30, ...past7Days.map(d => d.mins));
    const totalWeekMins = past7Days.reduce((a, b) => a + b.mins, 0);
    const avgDailyMins = Math.round(totalWeekMins / 7);

    return `
      <div class="focus-chart-card stagger-in">
        <div class="chart-header">
          <div>
            <p class="eyebrow">STATISTIKAT E FOKUSIT</p>
            <b style="font-size: 18px; display: block;">Ritmi Javor i Studimit</b>
            <small style="color: var(--text-muted);">Minutat e përqendrimit në 7 ditët e fundit</small>
          </div>
          <span class="badge-tag" style="font-size: 12px;">📊 ${totalWeekMins} min gjithsej</span>
        </div>

        <div class="chart-bars-container">
          ${past7Days.map(d => {
            const heightPercent = Math.max(8, Math.round((d.mins / maxMins) * 100));
            return `
              <div class="chart-bar-col ${d.isToday ? 'today' : ''}">
                <div class="chart-bar-wrap">
                  <div class="chart-bar" style="height: ${heightPercent}%;">
                    <span class="chart-bar-val">${d.mins}m</span>
                  </div>
                </div>
                <span class="chart-bar-day">${d.day}</span>
              </div>
            `;
          }).join("")}
        </div>

        <div class="chart-summary-row">
          <span>Mesatarja ditore: <b>${avgDailyMins} min/ditë</b></span>
          <span>Dita më aktive: <b>${Math.max(...past7Days.map(d => d.mins))} min</b></span>
        </div>
      </div>
    `;
  }
